version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
  - package-ecosystem: pip
    directory: /local-companion
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      companion-runtime:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

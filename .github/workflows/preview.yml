name: Preview CD

on:
  workflow_run:
    workflows: [CI]
    branches: [Preview]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Preview commit to deploy (defaults to current Preview head)
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: tda-preview
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_9wuTfarCQ3L63xtufPKUDzi0
  VERCEL_PROJECT_ID: prj_hDiDvvRiesg3qCDekGWE8JQMkIyH
  VERCEL_CLI_VERSION: 59.11.7

jobs:
  deploy:
    name: deploy-preview
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      REQUESTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: Preview
          fetch-depth: 0

      - name: Resolve and pin Preview source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin Preview
          CURRENT_SHA="$(git rev-parse origin/Preview)"
          SOURCE_SHA="${REQUESTED_SHA:-$CURRENT_SHA}"

          if [[ "$SOURCE_SHA" != "$CURRENT_SHA" ]]; then
            echo "::error::Refusing stale/arbitrary Preview deploy. Requested ${SOURCE_SHA}, current Preview is ${CURRENT_SHA}."
            exit 1
          fi

          git checkout --detach "$SOURCE_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Require Vercel deployment credential
        shell: bash
        run: |
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub Environment secret VERCEL_TOKEN for preview."
            exit 1
          fi

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull Preview configuration
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Preview artifact
        env:
          APP_ENV: preview
          APP_COMMIT_SHA: ${{ steps.source.outputs.sha }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy immutable Preview artifact
        id: deploy
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_SHORT: ${{ steps.source.outputs.short }}
        run: |
          set -euo pipefail
          URL="$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN" \
            --env APP_ENV=preview \
            --env APP_COMMIT_SHA="$SOURCE_SHA" \
            --env TDA_RELEASE_ID="preview-$SOURCE_SHORT" | tail -n 1)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview deployment: $URL"

      - name: Smoke Preview deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          vercel curl /api/health --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > health.json
          vercel curl /api/version --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > version.json
          vercel curl / --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" -- --fail --silent --show-error --output /dev/null
          vercel curl /sessoes --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" -- --fail --silent --show-error --output /dev/null

          node --input-type=module -e '
            import fs from "node:fs";
            const health = JSON.parse(fs.readFileSync("health.json", "utf8"));
            const expected = process.env.SOURCE_SHA;
            if (health.ok !== true) throw new Error("Preview health is not ok");
            if (health.environment !== "preview") throw new Error(`Expected preview environment, got ${health.environment}`);
            if (health.commit !== expected) throw new Error(`Expected commit ${expected}, got ${health.commit}`);
          '

      - name: Preview summary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          {
            echo "## TDA Preview"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Deployment: $DEPLOYMENT_URL"
            echo "- Smoke: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

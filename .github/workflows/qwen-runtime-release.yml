name: Qwen Runtime Release

on:
  push:
    branches: [main]
    tags:
      - 'companion-qwen-runtime-v*.*.*'
    paths:
      - '.github/workflows/qwen-runtime-release.yml'
      - 'local-companion/runtime/qwen-windows-x64.json'
      - 'local-companion/packaging/build_qwen_runtime.py'
      - 'local-companion/packaging/qwen_runtime_entry.py'
      - 'local-companion/tda_companion/asr_qwen.py'
      - 'local-companion/tda_companion/qwen_acceptance.py'
      - 'local-companion/tda_companion/qwen_physical_gate.py'
      - 'local-companion/tda_companion/qwen_runtime.py'
      - 'local-companion/tda_companion/qwen_runtime_bundle.py'
      - 'local-companion/tda_companion/asr_worker.py'
      - 'local-companion/tda_companion/worker_protocol.py'

concurrency:
  group: qwen-runtime-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build-qwen-runtime-windows-x64
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.13'
      - name: Verify release source and pinned runtime version
        shell: pwsh
        run: |
          $version = (Get-Content local-companion/runtime/qwen-windows-x64.json | ConvertFrom-Json).version
          $expected = "companion-qwen-runtime-v$version"
          if ("${{ github.ref_type }}" -eq "tag") {
            if ("${{ github.ref_name }}" -ne $expected) {
              throw "Tag ${{ github.ref_name }} does not match pinned runtime version $expected"
            }
          } elseif ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Qwen runtime release branch source must be main"
          }
      - name: Build, probe and install-smoke Qwen runtime
        shell: pwsh
        run: python local-companion/packaging/build_qwen_runtime.py
      - name: Upload release payload
        uses: actions/upload-artifact@v7
        with:
          name: TDAQwenRuntimeRelease-windows-x64
          path: |
            local-companion/out/qwen-runtime-package/TDAQwenRuntime-*-windows-x64.zip.part*
            local-companion/out/qwen-runtime-package/TDAQwenRuntimeBundle-*-windows-x64.json
            local-companion/out/qwen-runtime-package/TDAQwenRuntimePackage-*-windows-x64.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: publish-qwen-runtime-release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: TDAQwenRuntimeRelease-windows-x64
          path: dist
      - name: Publish immutable Qwen runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python - <<'PY'
          import json, pathlib
          value = json.loads(pathlib.Path('local-companion/runtime/qwen-windows-x64.json').read_text(encoding='utf-8'))
          print(value['version'])
          PY
          )
          TAG="companion-qwen-runtime-v${VERSION}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pinned runtime version $TAG"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != "tag" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Qwen runtime branch release source must be main"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the Qwen runtime version before publishing another artifact."
            exit 1
          fi
          BUNDLE="dist/TDAQwenRuntimeBundle-${VERSION}-windows-x64.json"
          REPORT="dist/TDAQwenRuntimePackage-${VERSION}-windows-x64.json"
          test -f "$BUNDLE"
          test -f "$REPORT"
          python - <<'PY'
          import json, pathlib
          report = json.loads(next(pathlib.Path('dist').glob('TDAQwenRuntimePackage-*-windows-x64.json')).read_text(encoding='utf-8'))
          bundle = json.loads(next(pathlib.Path('dist').glob('TDAQwenRuntimeBundle-*-windows-x64.json')).read_text(encoding='utf-8'))
          if report.get('archive_sha256') != bundle.get('archive', {}).get('sha256'):
              raise SystemExit('archive digest mismatch between package report and bundle manifest')
          parts = bundle.get('parts') or []
          if not parts:
              raise SystemExit('bundle has no parts')
          for part in parts:
              path = pathlib.Path('dist') / part['name']
              if not path.is_file() or path.stat().st_size != part['size']:
                  raise SystemExit(f"missing or size-mismatched release part: {path}")
          PY
          cat > release-notes.md <<EOF
          Runtime isolado oficial do TDA Companion para Qwen3-ASR no Windows x64.

          - Qwen3-ASR 0.6B/1.7B e Forced Aligner usam modelos separados do runtime.
          - Torch/CUDA/Transformers ficam contidos no runtime; Python/PATH globais não são alterados.
          - O bundle pode ter uma ou várias partes; cada parte e o archive lógico possuem SHA-256.
          - O worker foi submetido a probe e smoke de instalação no CI sem GPU.
          - O gate físico da RTX 4070 é uma validação separada e continua obrigatório para promover a capacidade no produto.
          EOF
          mapfile -t PARTS < <(find dist -maxdepth 1 -type f -name "TDAQwenRuntime-${VERSION}-windows-x64.zip.part*" | sort)
          test "${#PARTS[@]}" -gt 0
          gh release create "$TAG" "$BUNDLE" "$REPORT" "${PARTS[@]}" \
            --target "$GITHUB_SHA" \
            --title "TDA Qwen Runtime v${VERSION}" \
            --notes-file release-notes.md

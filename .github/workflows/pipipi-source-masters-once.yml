name: Pipipi source masters once

on:
  push:
    branches:
      - claquete/pipipi-source-masters-100

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[source-masters]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_9wuTfarCQ3L63xtufPKUDzi0
      VERCEL_PROJECT_ID: prj_hDiDvvRiesg3qCDekGWE8JQMkIyH
      VERCEL_CLI_VERSION: 59.11.7
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rebase worktree on current Preview
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin Preview
          git reset --hard origin/Preview
          git clean -fdx

      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull production environment without logging secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::VERCEL_TOKEN unavailable"
            exit 1
          fi
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" >/dev/null
          test -f .vercel/.env.production.local

      - name: Fetch exact canonical Pipipi masters from authenticated R2
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .vercel/.env.production.local
          set +a

          for key in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_PUBLIC_BUCKET; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Production environment is missing required R2 credential: ${key}"
              exit 1
            fi
          done
          if [[ "$R2_PUBLIC_BUCKET" != "tda-media-public" ]]; then
            echo "::error::Unexpected public R2 bucket"
            exit 1
          fi

          mkdir -p .tmp/pipipi-source
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { writeFile } from "node:fs/promises";
          import {
            S3Client,
            GetObjectCommand,
            ListObjectsV2Command,
          } from "@aws-sdk/client-s3";

          const expected = [
            {
              filename: "super-static.webp",
              sourceFilename: "super_herois.webp",
              sha256: "365d544c0d2d45341551d81697d8063f9502215aab2cdd2d28851d12614bbe68",
              bytes: 289362,
              canonicalKey: "lore/pipipi/365d544c0d2d45341551d81697d8063f9502215aab2cdd2d28851d12614bbe68/super_herois.webp",
            },
            {
              filename: "cadeira-static.webp",
              sourceFilename: "cadeira.webp",
              sha256: "c00cac253196df6dd068ae261c99cdff00a83165d5bba1addf8011c9f2aeb428",
              bytes: 164130,
              canonicalKey: "lore/pipipi/c00cac253196df6dd068ae261c99cdff00a83165d5bba1addf8011c9f2aeb428/cadeira.webp",
            },
            {
              filename: "ultimo-dia-static.webp",
              sourceFilename: "ultimo_dia.webp",
              sha256: "010dc872e51f9f380ebb260a44bd749e898713c66e849ea1b3f2b21b1731333a",
              bytes: 315228,
              canonicalKey: "lore/pipipi/010dc872e51f9f380ebb260a44bd749e898713c66e849ea1b3f2b21b1731333a/ultimo_dia.webp",
            },
          ];

          const client = new S3Client({
            region: "auto",
            endpoint: `https://${process.env.R2_ACCOUNT_ID}.r2.cloudflarestorage.com`,
            credentials: {
              accessKeyId: process.env.R2_ACCESS_KEY_ID,
              secretAccessKey: process.env.R2_SECRET_ACCESS_KEY,
            },
            requestChecksumCalculation: "WHEN_REQUIRED",
          });
          const Bucket = process.env.R2_PUBLIC_BUCKET;

          let keys = [];
          let token;
          do {
            const page = await client.send(new ListObjectsV2Command({
              Bucket,
              Prefix: "lore/pipipi/",
              ContinuationToken: token,
            }));
            keys.push(...(page.Contents ?? []).map((item) => item.Key).filter(Boolean));
            token = page.IsTruncated ? page.NextContinuationToken : undefined;
          } while (token);

          for (const item of expected) {
            const candidates = [
              item.canonicalKey,
              ...keys.filter((key) =>
                key.includes(item.sha256) || key.endsWith(`/${item.sourceFilename}`),
              ),
            ];
            let matched = null;
            for (const Key of [...new Set(candidates)]) {
              try {
                const result = await client.send(new GetObjectCommand({ Bucket, Key }));
                const bytes = Buffer.from(await result.Body.transformToByteArray());
                const sha = createHash("sha256").update(bytes).digest("hex");
                if (sha === item.sha256 && bytes.length === item.bytes) {
                  matched = { Key, bytes };
                  break;
                }
              } catch (error) {
                const status = error?.$metadata?.httpStatusCode;
                if (status === 404 || error?.name === "NoSuchKey") continue;
                throw error;
              }
            }
            if (!matched) {
              throw new Error(`Canonical source master absent from authenticated R2: ${item.sourceFilename}`);
            }
            await writeFile(`.tmp/pipipi-source/${item.filename}`, matched.bytes);
            console.log(`R2_SOURCE_OK ${item.sourceFilename} ${item.bytes} ${item.sha256}`);
          }
          NODE

      - name: Verify exact bytes and full source resolution
        shell: bash
        run: |
          set -euo pipefail
          cd .tmp/pipipi-source
          printf '%s  %s\n' \
            '365d544c0d2d45341551d81697d8063f9502215aab2cdd2d28851d12614bbe68' 'super-static.webp' \
            'c00cac253196df6dd068ae261c99cdff00a83165d5bba1addf8011c9f2aeb428' 'cadeira-static.webp' \
            '010dc872e51f9f380ebb260a44bd749e898713c66e849ea1b3f2b21b1731333a' 'ultimo-dia-static.webp' \
            | sha256sum --check --strict
          test "$(stat -c%s super-static.webp)" = '289362'
          test "$(stat -c%s cadeira-static.webp)" = '164130'
          test "$(stat -c%s ultimo-dia-static.webp)" = '315228'
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import sharp from "sharp";
          for (const file of ["super-static.webp", "cadeira-static.webp", "ultimo-dia-static.webp"]) {
            const metadata = await sharp(fs.readFileSync(file)).metadata();
            if (metadata.width !== 1672 || metadata.height !== 941 || metadata.format !== "webp") {
              throw new Error(`${file}: expected WebP 1672x941, got ${metadata.format} ${metadata.width}x${metadata.height}`);
            }
            await sharp(fs.readFileSync(file), { failOn: "warning" }).stats();
            console.log(`SOURCE_DIMENSIONS_OK ${file} 1672x941`);
          }
          NODE

      - name: Install exact source masters and update runtime contract
        shell: bash
        run: |
          set -euo pipefail
          cp .tmp/pipipi-source/super-static.webp public/lore/pipipi/super-static.webp
          cp .tmp/pipipi-source/cadeira-static.webp public/lore/pipipi/cadeira-static.webp
          cp .tmp/pipipi-source/ultimo-dia-static.webp public/lore/pipipi/ultimo-dia-static.webp
          rm -f \
            public/lore/pipipi/super-static.avif \
            public/lore/pipipi/cadeira-static.avif \
            public/lore/pipipi/ultimo-dia-static.avif

          python - <<'PY'
          from pathlib import Path

          component = Path('src/features/lore/components/pipipi-cinematic-scene.tsx')
          text = component.read_text(encoding='utf-8')
          for old, new in [
              ('/lore/pipipi/super-static.avif', '/lore/pipipi/super-static.webp'),
              ('/lore/pipipi/cadeira-static.avif', '/lore/pipipi/cadeira-static.webp'),
              ('/lore/pipipi/ultimo-dia-static.avif', '/lore/pipipi/ultimo-dia-static.webp'),
          ]:
              text = text.replace(old, new)
          component.write_text(text, encoding='utf-8')

          test_path = Path('tests/pipipi-composition-polish.spec.ts')
          test = test_path.read_text(encoding='utf-8')
          for old, new in [
              ('/lore/pipipi/super-static.avif', '/lore/pipipi/super-static.webp'),
              ('/lore/pipipi/cadeira-static.avif', '/lore/pipipi/cadeira-static.webp'),
              ('/lore/pipipi/ultimo-dia-static.avif', '/lore/pipipi/ultimo-dia-static.webp'),
          ]:
              test = test.replace(old, new)
          if 'const sourceResolution = { width: 1672, height: 941 } as const;' not in test:
              marker = '] as const;\n\ntest("renders the three approved bed scenes as single static frames", async ({ page }) => {'
              replacement = '] as const;\n\nconst sourceResolution = { width: 1672, height: 941 } as const;\n\ntest("renders the three approved bed scenes as source-resolution single static frames", async ({\n\tpage,\n}) => {'
              if marker not in test:
                  raise SystemExit('expected Pipipi test marker not found')
              test = test.replace(marker, replacement, 1)
              needle = '\t\tawait expect(mediaImages.first()).toHaveAttribute("src", expected.artwork);\n'
              dimensions = '''\t\tawait expect(mediaImages.first()).toHaveAttribute("src", expected.artwork);\n\t\tawait expect\n\t\t\t.poll(() =>\n\t\t\t\tmediaImages.first().evaluate((element) => {\n\t\t\t\t\tconst image = element as HTMLImageElement;\n\t\t\t\t\treturn { width: image.naturalWidth, height: image.naturalHeight };\n\t\t\t\t}),\n\t\t\t)\n\t\t\t.toEqual(sourceResolution);\n'''
              if needle not in test:
                  raise SystemExit('expected Pipipi image assertion not found')
              test = test.replace(needle, dimensions, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Validate app before commit
        shell: bash
        run: |
          set -euo pipefail
          pnpm check
          pnpm build
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test tests/pipipi-composition-polish.spec.ts

      - name: Commit clean source-master fix on current Preview base
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '[source-masters] fix(lore): ship exact Pipipi source-resolution static artwork'
          git push --force-with-lease origin HEAD:claquete/pipipi-source-masters-100

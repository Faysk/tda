name: Reconcile Companion with Preview

on:
  push:
    branches:
      - integrate/companion-preview-20260912
    paths:
      - .github/workflows/reconcile-companion-preview.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: integrate/companion-preview-20260912

      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Merge Preview and resolve the two shared documentation indexes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin Preview

          set +e
          git merge --no-ff --no-commit origin/Preview
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            printf 'Conflicts found:\n%s\n' "${conflicts[*]}"
            if [[ ${#conflicts[@]} -ne 2 || "${conflicts[0]}" != "docs/README.md" || "${conflicts[1]}" != "docs/documentation/catalog.md" ]]; then
              echo "Unexpected merge conflicts; refusing broad automatic resolution."
              exit 1
            fi
          fi

          git checkout --theirs docs/README.md
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/README.md")
          text = path.read_text(encoding="utf-8")

          feature = "- [TDA Companion v0.3 — Desktop, Agent e ASR](features/companion-desktop-asr-v0.3.md) — arquitetura do Agent per-user, Desktop de controle e runtimes ASR isolados.\n"
          feature_anchor = "- [Processamento local no Edit](features/local-processing.md) — UI/adapters, ensaio sintético e gates de integração.\n"
          if feature not in text:
              if feature_anchor not in text:
                  raise SystemExit("Feature anchor not found in Preview README")
              text = text.replace(feature_anchor, feature_anchor + feature, 1)

          adr = "- [ADR-0013 — TDA Companion como Agent local, Desktop de controle e runtime ASR multi-engine](adr/0013-companion-agent-desktop-asr.md)\n"
          adr_anchor = "- [ADR-0012 — GitHub Actions controla a entrega](adr/0012-github-actions-controlled-delivery.md)\n"
          if adr not in text:
              if adr_anchor not in text:
                  raise SystemExit("ADR anchor not found in Preview README")
              text = text.replace(adr_anchor, adr_anchor + adr, 1)

          path.write_text(text, encoding="utf-8")
          PY
          git add docs/README.md

          git checkout --theirs docs/documentation/catalog.md
          git add docs/documentation/catalog.md

          corepack enable
          pnpm install --frozen-lockfile
          pnpm docs:generate
          git add docs/documentation/catalog.md

          remaining="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$remaining" ]]; then
            echo "Unresolved files remain:"
            printf '%s\n' "$remaining"
            exit 1
          fi

          git rm .github/workflows/reconcile-companion-preview.yml
          git add -A
          git commit -m "chore: reconcile Companion v0.3 with current Preview"
          git push origin HEAD:integrate/companion-preview-20260912

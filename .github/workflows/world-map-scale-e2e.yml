name: World Map Scale E2E

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/world-map-scale-e2e.yml"
      - "playwright.config.ts"
      - "tests/world-canvas-spatial-interaction.spec.ts"
      - "tests/world-explorer-first-viewport.spec.ts"
      - "tests/world-edge-style.spec.ts"
      - "tests/world-relation-polish-gates.spec.ts"
      - "tests/world-edge-rasterization.spec.ts"
      - "src/app/e2e-fixtures/world-edge-rasterization/**"
      - "src/features/world-explorer/fixtures/relation-stress.ts"
      - "src/features/world-explorer/edge-route-bends.ts"
      - "src/features/world-explorer/edge-routing.ts"
      - "src/features/world-explorer/floating-edge-geometry.ts"
      - "src/features/world-explorer/routed-edge-geometry.ts"
      - "src/features/world-explorer/adapters/react-flow.ts"
      - "src/features/world-explorer/components/world-offscreen-relation-cues.tsx"
      - "src/features/world-explorer/components/world-offscreen-relation-cues.module.css"
      - "src/features/world-explorer/components/world-status-overlay.tsx"
      - "src/features/world-explorer/components/world-status-overlay.module.css"
      - "src/features/world-explorer/components/world-floating-chrome.tsx"
      - "src/features/world-explorer/components/world-floating-chrome.module.css"
      - "src/features/world-explorer/world-semantic-zoom.ts"
      - "src/features/world-explorer/world-neighborhoods.ts"
      - "src/features/world-explorer/components/world-canvas.tsx"
      - "src/features/world-explorer/components/world-semantic-zoom-context.tsx"
      - "src/features/world-explorer/components/world-neighborhood-overlay.tsx"
      - "src/features/world-explorer/components/world-neighborhoods.module.css"
      - "src/features/world-explorer/components/entity-node.tsx"
      - "src/features/world-explorer/components/entity-node-v2.module.css"
      - "src/features/world-explorer/components/relation-edge.tsx"
      - "src/features/world-explorer/components/world-explorer-client.tsx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run map scale and viewport contracts
        run: >-
          pnpm exec playwright test
          tests/world-canvas-spatial-interaction.spec.ts
          tests/world-explorer-first-viewport.spec.ts
          tests/world-edge-style.spec.ts
          tests/world-relation-polish-gates.spec.ts
          tests/world-edge-rasterization.spec.ts
          --project=desktop-1080p
      - name: Upload sanitized World relation polish receipt
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: world-map-scale-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/world-relation-polish-1920x1080.png
            test-results/**/world-edge-raster-public-dark.png
            test-results/**/world-edge-raster-edit-light.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload World rasterization failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: world-edge-rasterization-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/test-failed-*.png
            test-results/**/trace.zip
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 14

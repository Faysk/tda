name: Debug loader check
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Capture pnpm check
        id: check
        shell: bash
        run: |
          set +e
          pnpm check > check.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report result on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXIT_CODE: ${{ steps.check.outputs.exit_code }}
        shell: bash
        run: |
          {
            echo '### Temporary loader check output'
            echo
            echo "exit: $EXIT_CODE"
            echo
            echo '```text'
            tail -c 30000 check.log
            echo
            echo '```'
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md

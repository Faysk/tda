name: Pipipi asset transfer

on:
  push:
    branches:
      - feat/pipipi-cinematic-lore

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pipipi-cinematic-lore
          fetch-depth: 1
      - name: Download and verify carrier
        env:
          SOURCE_URL: "https://oaisdmntpritalynorth.blob.core.windows.net/files/00000000-d130-8246-a8ea-3ce37fa2e26c/raw?se=2026-09-10T02%3A35%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=8a3038a3-ec9f-4e53-b65b-be01130721b0&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T02%3A17%3A40Z&ske=2026-09-11T02%3A17%3A40Z&sks=b&skv=2026-02-06&sig=1n6dvAynFEv72dje76rgtExjlfLJAQGZU5VIrOi3MJE%3D"
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 1 -fsSL "$SOURCE_URL" -o /tmp/pipipi-carrier.png
          test "$(wc -c < /tmp/pipipi-carrier.png)" -eq 460905
          tail -c +106 /tmp/pipipi-carrier.png > /tmp/pipipi-runtime-v4.tar
          echo "004856faeee6913abc82de080cec097d0065dc770c3017fca6d98f550495e0ec  /tmp/pipipi-runtime-v4.tar" | sha256sum -c -
      - name: Materialize final AVIF runtime
        run: |
          set -euo pipefail
          rm -rf /tmp/pipipi-assets
          mkdir -p /tmp/pipipi-assets public/lore/pipipi
          tar -xf /tmp/pipipi-runtime-v4.tar -C /tmp/pipipi-assets
          cat > /tmp/pipipi.sha256 <<'EOF'
          39f409991b7ceb198637333153bd457ab9338a6405e54c79974db54bf24cf982  acordou-bg.avif
          3db06b2a8216576452e99cc5d485b9d4e5da4fee7f28ff64856b507ef4d1ec9d  acordou-subject.avif
          5a5a0f4281b46824c4302a815fafff452734d4e1f2908fb4ac4734c88887a26a  cadeira-bg.avif
          1b9678741fa029ed6c76c84d91f9abdcdc94b91d7b7c44ab40886f9b367c0752  cadeira-subject.avif
          a2e400c56b9e18db51f06213d211e7ed81118a2675a89feaf460bb5bdb2a1959  casa-bg.avif
          a3ea5b4cad8cccbe90ed01ad7306436639995120c6bddee01638ca113f647820  casa-subject.avif
          50b5c88cf596b7f8c6d434abc7065df7af9c458710fce82a6c1fecd4f080cd23  corredores-bg.avif
          2fb0164a92fd12008f53e42e9433212d4787d3d788dc05cd017c662693235b13  corredores-subject.avif
          381de7c9a2cd8163891c081ee04f2893f2caa82f5f2d9d88b70e350320d4ae92  ghost-cry.avif
          135c4fa5a20fd7447d1470944b2a8fc1ce7e8ea69944ae886d9c3bf3d0c23611  ghost-flute.avif
          38ba8074b24a7cf0fc7448d5b13684eadecd785ec07935568654d15170dec84f  ghost-hearts.avif
          cd04c7e3fbbc647fbf44d18f9b76778a1d31c3b6f56a447cce99aa0a6a437272  ghost-soft.avif
          4b73eff366efc85b47fdaffcca30d99cf392f21e8c498549dc6a2cc7036ac5ce  ghost-surprise.avif
          a50beeeb7b598aaab89dc74e3e5cec0787df63092bf8a5487f9e450d3228f816  stage-bg.avif
          c372648d38ce17fe1dd3eb70fe4d7a038f13278930f8001efca875b57e889a7d  super-bg.avif
          0613f27dd4dc910835fe293198ba8a04aaa69f06566c05f034154b2d2aeb720b  super-subject.avif
          4f5fdf9203746e4a32592ba924a3ea4a4ec7c98ef8104050a5ec635ea929ae44  ultimo-dia-bg.avif
          b4be9868ca7af9e31caebe4dfe9939d32c784c8d69455af3fb940b0dfa8cd00a  ultimo-dia-subject.avif
          EOF
          (cd /tmp/pipipi-assets && sha256sum -c /tmp/pipipi.sha256)
          test "$(find /tmp/pipipi-assets -maxdepth 1 -type f -name '*.avif' | wc -l)" -eq 18
          rm -f public/lore/pipipi/*.avif
          cp /tmp/pipipi-assets/*.avif public/lore/pipipi/
      - name: Remove transfer scaffolding
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch .asset-bundles/pipipi-runtime-v4.tar tools/bootstrap-pipipi-assets.mjs .github/workflows/pipipi-transfer.yml
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts.dev = 'next dev';
          pkg.scripts.build = 'next build';
          delete pkg.scripts['assets:pipipi'];
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, '\t')}\n`);
          NODE
          git add package.json public/lore/pipipi/*.avif
      - name: Commit final assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(pipipi): materialize final cinematic assets"
          git push origin HEAD:feat/pipipi-cinematic-lore

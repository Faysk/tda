name: Seika R2 Probe

on:
  push:
    branches: [ops/seika-r2-probe-20260912]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BUCKET: ${{ secrets.R2_PUBLIC_BUCKET }}
      R2_PRIVATE_BUCKET: ${{ secrets.R2_PRIVATE_BUCKET }}
    steps:
      - name: Verify direct production R2 secret injection without values
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "DIRECT_SECRET $name missing"
              missing=1
            else
              echo "DIRECT_SECRET $name present length=${#value}"
            fi
          done
          echo "DIRECT_BUCKET public_present=$([[ -n "${R2_PUBLIC_BUCKET:-}" ]] && echo yes || echo no) private_present=$([[ -n "${R2_PRIVATE_BUCKET:-}" ]] && echo yes || echo no)"
          [[ "$missing" -eq 0 ]] || exit 1

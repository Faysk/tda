name: Seika R2 Probe

on:
  push:
    branches: [ops/seika-r2-probe-20260912]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: production
    env:
      VERCEL_ORG_ID: team_9wuTfarCQ3L63xtufPKUDzi0
      VERCEL_PROJECT_ID: prj_hDiDvvRiesg3qCDekGWE8JQMkIyH
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Link project and verify sensitive production vars through env run
        shell: bash
        run: |
          set -euo pipefail
          npm install --global vercel@59.11.7 >/dev/null 2>&1
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" >/dev/null
          vercel env run -e production --token="$VERCEL_TOKEN" -- bash -c '
            set -euo pipefail
            missing=0
            for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_PUBLIC_BUCKET R2_PRIVATE_BUCKET; do
              value="${!name:-}"
              if [[ -z "$value" || "$value" == "[SENSITIVE]" ]]; then
                echo "ENV_RUN $name unavailable"
                missing=1
              else
                echo "ENV_RUN $name available length=${#value}"
              fi
            done
            [[ "$missing" -eq 0 ]] || exit 1
          '

name: Runtime Promote Stable

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: Immutable runtime RC tag to promote
        required: true
        type: string
      confirmation:
        description: Type PROMOTE to authorize the final channel switch
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    name: verify physical receipt and promote exact runtime RC bytes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RC_TAG: ${{ inputs.rc_tag }}
      CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require main and explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Stable runtime promotion must be dispatched from main"; exit 1; }
          [[ "$CONFIRMATION" == "PROMOTE" ]] || { echo "::error::confirmation must be exactly PROMOTE"; exit 1; }
          [[ "$RC_TAG" =~ ^companion-(whisper|qwen)-runtime-rc-v[0-9]+\.[0-9]+\.[0-9]+-[a-f0-9]{12}$ ]] || { echo "::error::Invalid runtime RC tag shape"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact physical acceptance receipt for this RC
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT_PATH="docs/companion/runtime-acceptance/${RC_TAG}.json"
          [[ -f "$RECEIPT_PATH" ]] || { echo "::error::Missing runtime physical acceptance receipt at $RECEIPT_PATH"; exit 1; }
          echo "path=$RECEIPT_PATH" >> "$GITHUB_OUTPUT"

      - name: Require active prerelease RC
        id: release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RC_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,tagName,isDraft,isPrerelease,targetCommitish > rc-release.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          value = json.load(open('rc-release.json', encoding='utf-8'))
          if value.get('tagName') != os.environ['RC_TAG'] or value.get('isDraft') is not False or value.get('isPrerelease') is not True:
              raise SystemExit('RC_RELEASE_STATE_INVALID')
          release_id = value.get('databaseId')
          if not isinstance(release_id, int) or release_id <= 0:
              raise SystemExit('RC_RELEASE_ID_INVALID')
          print('release_id=' + str(release_id))
          PY

      - name: Download RC assets without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rc-assets
          gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --dir rc-assets
          test -f rc-assets/TDARuntime-candidate.json

      - name: Require Whisper #1235 Craig containment acceptance
        id: whisper1235
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import math
          from pathlib import Path

          candidate = json.loads(Path("rc-assets/TDARuntime-candidate.json").read_text(encoding="utf-8"))
          if candidate.get("family") != "whisper" or candidate.get("version") != "1.1.8":
              print("required=false")
              raise SystemExit(0)

          tag = candidate.get("candidate_tag")
          if not isinstance(tag, str) or not tag:
              raise SystemExit("WHISPER_1235_CANDIDATE_TAG_INVALID")
          evidence = Path("docs/companion/runtime-acceptance") / f"{tag}.whisper-1235.json"
          if not evidence.is_file() or evidence.stat().st_size <= 0 or evidence.stat().st_size > 512 * 1024:
              raise SystemExit("WHISPER_1235_ACCEPTANCE_RECEIPT_MISSING")
          receipt = json.loads(evidence.read_text(encoding="utf-8"))

          def exact_keys(value, expected, code):
              if not isinstance(value, dict) or set(value) != set(expected):
                  raise SystemExit(code)
              return value

          def safe_text(value, code, maximum=160):
              if not isinstance(value, str) or not value or len(value) > maximum or any(ord(ch) < 32 or ord(ch) == 127 for ch in value):
                  raise SystemExit(code)
              return value

          def positive_int(value, code):
              if isinstance(value, bool) or not isinstance(value, int) or value <= 0:
                  raise SystemExit(code)
              return value

          def nonnegative_int(value, code):
              if isinstance(value, bool) or not isinstance(value, int) or value < 0:
                  raise SystemExit(code)
              return value

          def finite_number(value, code, *, nonnegative=False):
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  raise SystemExit(code)
              number = float(value)
              if not math.isfinite(number) or (nonnegative and number < 0):
                  raise SystemExit(code)
              return number

          exact_keys(receipt, (
              "schema", "pass", "accepted_at", "candidate", "gpu", "profiles",
              "immutable_runs_verified", "contains_audio", "contains_transcript",
              "contains_text", "contains_speaker", "contains_local_paths", "contains_source_id",
          ), "WHISPER_1235_ACCEPTANCE_SHAPE_INVALID")
          if receipt.get("schema") != "tda_whisper_craig_containment_acceptance_v1" or receipt.get("pass") is not True:
              raise SystemExit("WHISPER_1235_ACCEPTANCE_RECEIPT_INVALID")
          safe_text(receipt.get("accepted_at"), "WHISPER_1235_ACCEPTED_AT_INVALID", 64)

          identity = exact_keys(receipt.get("candidate"), (
              "candidate_tag", "version", "runtime_id", "source_sha", "source_tree_sha",
              "workflow_run_id", "runtime_archive_sha256", "worker_sha256", "python", "packages",
          ), "WHISPER_1235_CANDIDATE_SHAPE_INVALID")
          for field in (
              "candidate_tag", "version", "runtime_id", "source_sha", "source_tree_sha",
              "workflow_run_id", "runtime_archive_sha256",
          ):
              if identity.get(field) != candidate.get(field):
                  raise SystemExit(f"WHISPER_1235_ACCEPTANCE_IDENTITY_MISMATCH:{field}")
          worker_sha = safe_text(identity.get("worker_sha256"), "WHISPER_1235_WORKER_SHA_INVALID", 64)
          if len(worker_sha) != 64 or any(ch not in "0123456789abcdef" for ch in worker_sha):
              raise SystemExit("WHISPER_1235_WORKER_SHA_INVALID")
          safe_text(identity.get("python"), "WHISPER_1235_PYTHON_VERSION_INVALID", 64)
          packages = exact_keys(identity.get("packages"), ("faster_whisper", "ctranslate2", "pyav"), "WHISPER_1235_PACKAGE_SHAPE_INVALID")
          for key, value in packages.items():
              safe_text(value, f"WHISPER_1235_PACKAGE_VERSION_INVALID:{key}", 64)

          gpu = exact_keys(receipt.get("gpu"), ("name", "driver_version", "required_name_match"), "WHISPER_1235_GPU_SHAPE_INVALID")
          safe_text(gpu.get("name"), "WHISPER_1235_GPU_NAME_INVALID")
          safe_text(gpu.get("driver_version"), "WHISPER_1235_GPU_DRIVER_INVALID", 64)
          if gpu.get("required_name_match") is not True:
              raise SystemExit("WHISPER_1235_GPU_IDENTITY_INVALID")

          for field in (
              "contains_audio", "contains_transcript", "contains_text",
              "contains_speaker", "contains_local_paths", "contains_source_id",
          ):
              if receipt.get(field) is not False:
                  raise SystemExit(f"WHISPER_1235_ACCEPTANCE_PRIVACY_INVALID:{field}")
          if receipt.get("immutable_runs_verified") is not True:
              raise SystemExit("WHISPER_1235_IMMUTABLE_RUN_REQUIRED")

          profiles = receipt.get("profiles")
          expected = ("whisper-turbo", "whisper-detailed")
          if (
              not isinstance(profiles, list)
              or len(profiles) != len(expected)
              or any(not isinstance(item, dict) for item in profiles)
              or [item.get("profile_id") for item in profiles] != list(expected)
          ):
              raise SystemExit("WHISPER_1235_PROFILE_EVIDENCE_INVALID")

          sample_keys = (
              "sample_seconds", "audio_work_seconds", "session_duration_seconds", "processing_seconds",
              "rtf", "word_count", "segment_count", "track_count", "warning_count",
              "span_widened_count", "span_examples",
          )
          full_keys = ("metrics", "span_widened_count", "span_examples", "run_committed")
          metric_keys = (
              "audio_work_seconds", "session_duration_seconds", "processing_seconds", "rtf",
              "word_count", "segment_count", "track_count", "turn_count", "deduplicated_segment_count",
          )
          span_keys = (
              "track", "segment", "start_seconds", "end_seconds",
              "relative_start_seconds", "relative_end_seconds",
          )

          for profile in profiles:
              exact_keys(profile, ("profile_id", "sample", "full"), "WHISPER_1235_PROFILE_SHAPE_INVALID")
              sample = exact_keys(profile.get("sample"), sample_keys, "WHISPER_1235_SAMPLE_SHAPE_INVALID")
              full = exact_keys(profile.get("full"), full_keys, "WHISPER_1235_FULL_SHAPE_INVALID")
              metrics = exact_keys(full.get("metrics"), metric_keys, "WHISPER_1235_FULL_METRICS_SHAPE_INVALID")
              if finite_number(sample.get("sample_seconds"), "WHISPER_1235_SAMPLE_DURATION_INVALID", nonnegative=True) != 300.0:
                  raise SystemExit("WHISPER_1235_SAMPLE_DURATION_INVALID")
              if positive_int(sample.get("track_count"), "WHISPER_1235_SAMPLE_TRACK_COUNT_INVALID") != 4:
                  raise SystemExit("WHISPER_1235_SAMPLE_TRACK_COUNT_INVALID")
              positive_int(sample.get("segment_count"), "WHISPER_1235_SAMPLE_SEGMENT_COUNT_INVALID")
              positive_int(sample.get("word_count"), "WHISPER_1235_SAMPLE_WORD_COUNT_INVALID")
              nonnegative_int(sample.get("warning_count"), "WHISPER_1235_SAMPLE_WARNING_COUNT_INVALID")
              for key in ("audio_work_seconds", "session_duration_seconds", "processing_seconds", "rtf"):
                  finite_number(sample.get(key), f"WHISPER_1235_SAMPLE_METRIC_INVALID:{key}", nonnegative=True)

              if full.get("run_committed") is not True:
                  raise SystemExit("WHISPER_1235_FULL_RUN_COMMIT_REQUIRED")
              if positive_int(metrics.get("track_count"), "WHISPER_1235_FULL_TRACK_COUNT_INVALID") != 4:
                  raise SystemExit("WHISPER_1235_FULL_TRACK_COUNT_INVALID")
              positive_int(metrics.get("segment_count"), "WHISPER_1235_FULL_SEGMENT_COUNT_INVALID")
              positive_int(metrics.get("word_count"), "WHISPER_1235_FULL_WORD_COUNT_INVALID")
              positive_int(metrics.get("turn_count"), "WHISPER_1235_FULL_TURN_COUNT_INVALID")
              nonnegative_int(metrics.get("deduplicated_segment_count"), "WHISPER_1235_FULL_DEDUP_COUNT_INVALID")
              for key in ("audio_work_seconds", "session_duration_seconds", "processing_seconds", "rtf"):
                  finite_number(metrics.get(key), f"WHISPER_1235_FULL_METRIC_INVALID:{key}", nonnegative=True)

              for phase in (sample, full):
                  count = nonnegative_int(phase.get("span_widened_count"), "WHISPER_1235_SPAN_COUNT_INVALID")
                  examples = phase.get("span_examples")
                  if not isinstance(examples, list) or len(examples) != min(count, 32):
                      raise SystemExit("WHISPER_1235_SPAN_EXAMPLES_INVALID")
                  for example in examples:
                      exact_keys(example, span_keys, "WHISPER_1235_SPAN_EXAMPLE_SHAPE_INVALID")
                      track = positive_int(example.get("track"), "WHISPER_1235_SPAN_TRACK_INVALID")
                      positive_int(example.get("segment"), "WHISPER_1235_SPAN_SEGMENT_INVALID")
                      if track > 4:
                          raise SystemExit("WHISPER_1235_SPAN_TRACK_INVALID")
                      start = finite_number(example.get("start_seconds"), "WHISPER_1235_SPAN_START_INVALID", nonnegative=True)
                      end = finite_number(example.get("end_seconds"), "WHISPER_1235_SPAN_END_INVALID", nonnegative=True)
                      before = finite_number(example.get("relative_start_seconds"), "WHISPER_1235_SPAN_RELATIVE_START_INVALID")
                      after = finite_number(example.get("relative_end_seconds"), "WHISPER_1235_SPAN_RELATIVE_END_INVALID")
                      if end < start or before > 0 or after < 0 or (before >= -0.05 and after <= 0.05):
                          raise SystemExit("WHISPER_1235_SPAN_RELATION_INVALID")

          prepared = Path("prepared")
          prepared.mkdir(parents=True, exist_ok=True)
          retained = prepared / "Whisper-1235-acceptance.json"
          retained.write_bytes(evidence.read_bytes())
          digest = hashlib.sha256(retained.read_bytes()).hexdigest()
          print("required=true")
          print(f"sha256={digest}")
          PY

      - name: Verify candidate bytes and physical receipt
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prepared
          cp "${{ steps.receipt.outputs.path }}" prepared/TDARuntime-acceptance.json
          STABLE_TAG="$(PYTHONPATH=local-companion python -m tda_companion.runtime_release_evidence verify-promotion \
            --candidate-manifest rc-assets/TDARuntime-candidate.json \
            --acceptance-receipt prepared/TDARuntime-acceptance.json \
            --assets-root rc-assets \
            --output prepared/TDARuntime-promotion.json)"
          [[ "$STABLE_TAG" =~ ^companion-(whisper|qwen)-runtime-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          value = json.load(open('prepared/TDARuntime-promotion.json', encoding='utf-8'))
          if value['candidate_tag'] != os.environ['RC_TAG']:
              raise SystemExit('RC_EVIDENCE_TAG_MISMATCH')
          print('stable_tag=' + value['stable_tag'])
          print('family=' + value['family'])
          print('version=' + value['version'])
          print('source_sha=' + value['source_sha'])
          print('source_tree_sha=' + value['source_tree_sha'])
          print('runtime_archive_sha256=' + value['runtime_archive_sha256'])
          PY

      - name: Require current main to preserve the physically tested runtime inputs
        shell: bash
        env:
          FAMILY: ${{ steps.evidence.outputs.family }}
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ steps.evidence.outputs.source_sha }}"
          git fetch --no-tags origin "$SOURCE_SHA"
          git cat-file -e "${SOURCE_SHA}^{commit}"

          # This is a byte-drift fence, not a "nothing in the repository changed"
          # fence. Keep it aligned with Runtime RC family inputs so acceptance,
          # tests, Web/docs and release-orchestration changes do not invalidate
          # an already physically accepted runtime archive.
          if [[ "$FAMILY" == "whisper" ]]; then
            RUNTIME_PATHS=(
              ".github/workflows/whisper-runtime.yml"
              "local-companion/runtime/**"
              "local-companion/packaging/build_whisper_runtime.py"
              "local-companion/packaging/runtime_bootstrap_smoke.py"
              "local-companion/packaging/whisper_runtime_entry.py"
              "local-companion/tda_companion/asr_acceptance.py"
              "local-companion/tda_companion/asr_runtime.py"
              "local-companion/tda_companion/asr_whisper.py"
              "local-companion/tda_companion/asr_checkpoints.py"
              "local-companion/tda_companion/asr_models.py"
              "local-companion/tda_companion/asr_timeline.py"
              "local-companion/tda_companion/runtime_artifact.py"
              "local-companion/tda_companion/engine_metrics.py"
              "local-companion/tda_companion/execution_device.py"
              "local-companion/tda_companion/craig.py"
              "local-companion/tda_companion/craig_runtime.py"
              "local-companion/tda_companion/flac_metadata.py"
              "local-companion/tda_companion/transcript.py"
              "local-companion/tda_companion/transcription_runs.py"
              "local-companion/tda_companion/atomic_storage.py"
              "local-companion/tda_companion/attempt_fence.py"
              "local-companion/tda_companion/asr_worker.py"
              "local-companion/tda_companion/worker_protocol.py"
            )
          elif [[ "$FAMILY" == "qwen" ]]; then
            RUNTIME_PATHS=(
              ".github/workflows/qwen-runtime.yml"
              ".github/workflows/qwen-runtime-package.yml"
              "local-companion/runtime/qwen-windows-x64.json"
              "local-companion/packaging/build_qwen_runtime.py"
              "local-companion/packaging/runtime_bootstrap_smoke.py"
              "local-companion/packaging/build_qwen_runtime_plan.py"
              "local-companion/packaging/qwen_runtime_entry.py"
              "local-companion/packaging/qwen_runtime_probe.py"
              "local-companion/tda_companion/asr_qwen.py"
              "local-companion/tda_companion/asr_qwen_strict.py"
              "local-companion/tda_companion/qwen_checkpoint_compat.py"
              "local-companion/tda_companion/asr_checkpoints.py"
              "local-companion/tda_companion/asr_models.py"
              "local-companion/tda_companion/asr_timeline.py"
              "local-companion/tda_companion/runtime_artifact.py"
              "local-companion/tda_companion/engine_metrics.py"
              "local-companion/tda_companion/execution_device.py"
              "local-companion/tda_companion/craig.py"
              "local-companion/tda_companion/craig_runtime.py"
              "local-companion/tda_companion/flac_metadata.py"
              "local-companion/tda_companion/qwen_acceptance.py"
              "local-companion/tda_companion/qwen_acceptance_window.py"
              "local-companion/tda_companion/qwen_physical_gate.py"
              "local-companion/tda_companion/qwen_runtime.py"
              "local-companion/tda_companion/qwen_runtime_bundle.py"
              "local-companion/tda_companion/transcript.py"
              "local-companion/tda_companion/transcription_runs.py"
              "local-companion/tda_companion/atomic_storage.py"
              "local-companion/tda_companion/attempt_fence.py"
              "local-companion/tda_companion/asr_worker.py"
              "local-companion/tda_companion/worker_protocol.py"
              "local-companion/tda_companion/worker_supervisor.py"
            )
          else
            echo "::error::RUNTIME_PROMOTION_FAMILY_INVALID:$FAMILY"
            exit 1
          fi

          if ! git diff --quiet "$SOURCE_SHA" HEAD -- "${RUNTIME_PATHS[@]}"; then
            echo "::error::RUNTIME_PROMOTION_RUNTIME_INPUT_DRIFT"
            git diff --name-only "$SOURCE_SHA" HEAD -- "${RUNTIME_PATHS[@]}"
            exit 1
          fi

      - name: Verify RC tag and release target resolve to tested source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ steps.evidence.outputs.source_sha }}"
          git fetch --force origin "refs/tags/$RC_TAG:refs/tags/$RC_TAG"
          [[ "$(git rev-list -n 1 "$RC_TAG")" == "$SOURCE_SHA" ]] || { echo "::error::RC tag target mismatch"; exit 1; }
          TARGET="$(python -c "import json; print(json.load(open('rc-release.json')).get('targetCommitish') or '')")"
          [[ "$TARGET" == "$SOURCE_SHA" ]] || { echo "::error::RC release target mismatch"; exit 1; }

      - name: Require stable identity to be unused
        shell: bash
        run: |
          set -euo pipefail
          STABLE_TAG="${{ steps.evidence.outputs.stable_tag }}"
          ! gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || { echo "::error::Stable runtime release already exists"; exit 1; }
          ! git ls-remote --exit-code --tags origin "refs/tags/$STABLE_TAG" >/dev/null 2>&1 || { echo "::error::Stable runtime tag already exists"; exit 1; }

      - name: Attach audit evidence idempotently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-current
          FILES=(TDARuntime-acceptance.json TDARuntime-promotion.json)
          if [[ -f prepared/Whisper-1235-acceptance.json ]]; then
            FILES+=(Whisper-1235-acceptance.json)
          fi
          for NAME in "${FILES[@]}"; do
            if gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir evidence-current >/dev/null 2>&1; then
              cmp -s "evidence-current/$NAME" "prepared/$NAME" || { echo "::error::Existing RC evidence $NAME differs"; exit 1; }
            else
              gh release upload "$RC_TAG" --repo "$GITHUB_REPOSITORY" "prepared/$NAME"
            fi
          done

      - name: Re-download evidence before channel switch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence-check && mkdir evidence-check
          PATTERNS=(--pattern 'TDARuntime-acceptance.json' --pattern 'TDARuntime-promotion.json')
          if [[ -f prepared/Whisper-1235-acceptance.json ]]; then
            PATTERNS+=(--pattern 'Whisper-1235-acceptance.json')
          fi
          gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" "${PATTERNS[@]}" --dir evidence-check
          cmp -s evidence-check/TDARuntime-acceptance.json prepared/TDARuntime-acceptance.json
          cmp -s evidence-check/TDARuntime-promotion.json prepared/TDARuntime-promotion.json
          if [[ -f prepared/Whisper-1235-acceptance.json ]]; then
            cmp -s evidence-check/Whisper-1235-acceptance.json prepared/Whisper-1235-acceptance.json
          fi

      - name: Promote the same release object and runtime assets to stable
        shell: bash
        run: |
          set -euo pipefail
          STABLE_TAG="${{ steps.evidence.outputs.stable_tag }}"
          FAMILY="${{ steps.evidence.outputs.family }}"
          VERSION="${{ steps.evidence.outputs.version }}"
          SOURCE_SHA="${{ steps.evidence.outputs.source_sha }}"
          RECEIPT_SHA="$(sha256sum prepared/TDARuntime-acceptance.json | awk '{print $1}')"
          cat > stable-notes.md <<EOF
          Runtime oficial do TDA Companion para ${FAMILY} no Windows x64.

          Promoção do candidato físico ${RC_TAG}; assets não foram recompilados nem reenviados.

          - Source SHA testado: ${SOURCE_SHA}
          - Source tree SHA: ${{ steps.evidence.outputs.source_tree_sha }}
          - Runtime archive SHA-256: ${{ steps.evidence.outputs.runtime_archive_sha256 }}
          - Physical acceptance receipt SHA-256: ${RECEIPT_SHA}
          EOF
          gh release edit "$RC_TAG" --repo "$GITHUB_REPOSITORY" --tag "$STABLE_TAG" --target "$SOURCE_SHA" \
            --title "TDA ${FAMILY} Runtime v${VERSION}" --notes-file stable-notes.md --prerelease=false

      - name: Verify stable postconditions from fresh downloads
        shell: bash
        env:
          STABLE_TAG: ${{ steps.evidence.outputs.stable_tag }}
          SOURCE_SHA: ${{ steps.evidence.outputs.source_sha }}
          EXPECTED_RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,tagName,isDraft,isPrerelease,targetCommitish > stable-release.json
          python - <<'PY'
          import json, os
          value = json.load(open('stable-release.json', encoding='utf-8'))
          if value.get('tagName') != os.environ['STABLE_TAG'] or value.get('isDraft') is not False or value.get('isPrerelease') is not False:
              raise SystemExit('STABLE_RELEASE_STATE_INVALID')
          if value.get('targetCommitish') != os.environ['SOURCE_SHA']:
              raise SystemExit('STABLE_RELEASE_TARGET_MISMATCH')
          if str(value.get('databaseId')) != os.environ['EXPECTED_RELEASE_ID']:
              raise SystemExit('STABLE_RELEASE_OBJECT_CHANGED')
          PY
          rm -rf stable-check && mkdir stable-check
          gh release download "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --dir stable-check
          PYTHONPATH=local-companion python -m tda_companion.runtime_release_evidence verify-promotion \
            --candidate-manifest stable-check/TDARuntime-candidate.json \
            --acceptance-receipt stable-check/TDARuntime-acceptance.json \
            --assets-root stable-check \
            --output stable-check/post-promotion.json >/dev/null
          cmp -s stable-check/TDARuntime-promotion.json stable-check/post-promotion.json
          git fetch --force origin "refs/tags/$STABLE_TAG:refs/tags/$STABLE_TAG"
          [[ "$(git rev-list -n 1 "$STABLE_TAG")" == "$SOURCE_SHA" ]] || { echo "::error::Stable runtime tag target mismatch"; exit 1; }
          echo "RUNTIME_STABLE_PROMOTION_VERIFIED tag=$STABLE_TAG source=$SOURCE_SHA release_id=$EXPECTED_RELEASE_ID"

name: Temporary Code Scanning Inventory
on:
  push:
    branches:
      - codex/code-scanning-inventory-20261008
permissions:
  contents: read
  security-events: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List open CodeQL alerts on main (metadata only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          total = 0
          for page in range(1, 21):
              params = urlencode({
                  "state": "open", "ref": "refs/heads/main",
                  "per_page": 100, "page": page,
              })
              url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/code-scanning/alerts?{params}"
              request = Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urlopen(request, timeout=20) as response:
                      alerts = json.load(response)
              except HTTPError as exc:
                  print(f"INVENTORY_API_ERROR status={exc.code}", flush=True)
                  sys.exit(1)
              for alert in alerts:
                  recent = alert.get("most_recent_instance") or {}
                  rule = alert.get("rule") or {}
                  loc = recent.get("location") or {}
                  safe = {
                      "number": alert.get("number"),
                      "state": alert.get("state"),
                      "rule": rule.get("id"),
                      "severity": rule.get("security_severity_level") or rule.get("severity"),
                      "description": rule.get("description"),
                      "path": loc.get("path"),
                      "start_line": loc.get("start_line"),
                      "url": alert.get("html_url"),
                  }
                  print("SECURITY_ALERT " + json.dumps(safe, ensure_ascii=True), flush=True)
                  total += 1
              if len(alerts) < 100:
                  break
          print(f"INVENTORY_TOTAL_OPEN_MAIN={total}", flush=True)
          PY

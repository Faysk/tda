name: Qwen Runtime Package
# Qwen runtime packages are immutable per semantic version. A successful main
# package may dispatch the exact-source Runtime RC for physical acceptance.
# Runtime RC drift fencing mirrors this workflow's runtime inputs.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/qwen-runtime-package.yml'
      - 'local-companion/runtime/qwen-windows-x64.json'
      - 'local-companion/packaging/build_qwen_runtime.py'
      - 'local-companion/packaging/runtime_bootstrap_smoke.py'
      - 'local-companion/packaging/qwen_runtime_entry.py'
      - 'local-companion/tda_companion/asr_qwen.py'
      - 'local-companion/tda_companion/asr_checkpoints.py'
      - 'local-companion/tda_companion/asr_models.py'
      - 'local-companion/tda_companion/asr_timeline.py'
      - 'local-companion/tda_companion/runtime_artifact.py'
      - 'local-companion/tda_companion/engine_metrics.py'
      - 'local-companion/tda_companion/execution_device.py'
      - 'local-companion/tda_companion/craig.py'
      - 'local-companion/tda_companion/craig_runtime.py'
      - 'local-companion/tda_companion/flac_metadata.py'
      - 'local-companion/tda_companion/qwen_acceptance_window.py'
      - 'local-companion/tda_companion/transcript.py'
      - 'local-companion/tda_companion/transcription_runs.py'
      - 'local-companion/tda_companion/atomic_storage.py'
      - 'local-companion/tda_companion/attempt_fence.py'
      - 'local-companion/tda_companion/asr_qwen_strict.py'
      - 'local-companion/tda_companion/qwen_checkpoint_compat.py'
      - 'local-companion/tda_companion/qwen_acceptance.py'
      - 'local-companion/tda_companion/qwen_physical_gate.py'
      - 'local-companion/tda_companion/qwen_runtime.py'
      - 'local-companion/tda_companion/qwen_runtime_bundle.py'
      - 'local-companion/tda_companion/asr_worker.py'
      - 'local-companion/tda_companion/worker_protocol.py'
  push:
    branches: [main, Preview]
    paths:
      - '.github/workflows/qwen-runtime-package.yml'
      - 'local-companion/runtime/qwen-windows-x64.json'
      - 'local-companion/packaging/build_qwen_runtime.py'
      - 'local-companion/packaging/runtime_bootstrap_smoke.py'
      - 'local-companion/packaging/qwen_runtime_entry.py'
      - 'local-companion/tda_companion/asr_qwen.py'
      - 'local-companion/tda_companion/asr_checkpoints.py'
      - 'local-companion/tda_companion/asr_models.py'
      - 'local-companion/tda_companion/asr_timeline.py'
      - 'local-companion/tda_companion/runtime_artifact.py'
      - 'local-companion/tda_companion/engine_metrics.py'
      - 'local-companion/tda_companion/execution_device.py'
      - 'local-companion/tda_companion/craig.py'
      - 'local-companion/tda_companion/craig_runtime.py'
      - 'local-companion/tda_companion/flac_metadata.py'
      - 'local-companion/tda_companion/qwen_acceptance_window.py'
      - 'local-companion/tda_companion/transcript.py'
      - 'local-companion/tda_companion/transcription_runs.py'
      - 'local-companion/tda_companion/atomic_storage.py'
      - 'local-companion/tda_companion/attempt_fence.py'
      - 'local-companion/tda_companion/asr_qwen_strict.py'
      - 'local-companion/tda_companion/qwen_checkpoint_compat.py'
      - 'local-companion/tda_companion/qwen_acceptance.py'
      - 'local-companion/tda_companion/qwen_physical_gate.py'
      - 'local-companion/tda_companion/qwen_runtime.py'
      - 'local-companion/tda_companion/qwen_runtime_bundle.py'
      - 'local-companion/tda_companion/asr_worker.py'
      - 'local-companion/tda_companion/worker_protocol.py'

concurrency:
  group: qwen-runtime-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: qwen-runtime-package-windows-x64
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      TDA_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require main for manual exact-source build
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/main") { throw "RUNTIME_MANUAL_BUILD_REQUIRES_MAIN" }
      - name: Verify exact source checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:TDA_SOURCE_SHA.ToLowerInvariant()) { throw "BUILD_SOURCE_SHA_MISMATCH:$actual" }
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.18'
      - name: Build, probe and install-smoke isolated Qwen runtime
        shell: pwsh
        run: python local-companion/packaging/build_qwen_runtime.py
      - name: Upload verified runtime bundle parts and reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TDAQwenRuntimeBundle-windows-x64
          path: |
            local-companion/out/qwen-runtime-package/TDAQwenRuntime-*-windows-x64.zip.part*
            local-companion/out/qwen-runtime-package/TDAQwenRuntimeBundle-*-windows-x64.json
            local-companion/out/qwen-runtime-package/TDAQwenRuntimePackage-*-windows-x64.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  dispatch-runtime-rc:
    name: dispatch exact Qwen package to Runtime RC
    needs: package
    if: ${{ needs.package.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ensure Runtime RC workflow is available for the new immutable Qwen version
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW="runtime-rc.yml"
          RUNTIME_VERSION="$(
            gh api "repos/$GITHUB_REPOSITORY/contents/local-companion/runtime/qwen-windows-x64.json?ref=$GITHUB_SHA" --jq .content \
              | base64 --decode \
              | python -c 'import json,sys; print(json.load(sys.stdin)["version"])'
          )"
          [[ "$RUNTIME_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::QWEN_RUNTIME_VERSION_INVALID:$RUNTIME_VERSION"
            exit 1
          }

          RC_PREFIX="companion-qwen-runtime-rc-v$RUNTIME_VERSION-"
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease \
            --jq ".[] | select(.tagName | startswith(\"$RC_PREFIX\")) | .tagName" | grep -q .; then
            echo "::error::QWEN_RUNTIME_RC_VERSION_ALREADY_PUBLISHED:$RUNTIME_VERSION"
            exit 1
          fi

          WORKFLOW_STATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW" --jq .state)"
          case "$WORKFLOW_STATE" in
            active)
              echo "QWEN_RUNTIME_RC_WORKFLOW_ACTIVE version=$RUNTIME_VERSION"
              ;;
            disabled_manually|disabled_inactivity)
              gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/enable"
              RESTORED_STATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW" --jq .state)"
              [[ "$RESTORED_STATE" == "active" ]] || {
                echo "::error::QWEN_RUNTIME_RC_WORKFLOW_RESTORE_FAILED:$RESTORED_STATE"
                exit 1
              }
              echo "QWEN_RUNTIME_RC_WORKFLOW_RESTORED version=$RUNTIME_VERSION previous_state=$WORKFLOW_STATE"
              ;;
            *)
              echo "::error::QWEN_RUNTIME_RC_WORKFLOW_STATE_UNSAFE:$WORKFLOW_STATE"
              exit 1
              ;;
          esac

      - name: Dispatch Runtime RC for exact main source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::QWEN_RUNTIME_RC_SOURCE_INVALID"; exit 1; }
          gh workflow run runtime-rc.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f family=qwen \
            -f source_sha="$GITHUB_SHA" \
            -f build_run_id="$GITHUB_RUN_ID"
          echo "QWEN_RUNTIME_RC_DISPATCHED source=$GITHUB_SHA build_run_id=$GITHUB_RUN_ID"

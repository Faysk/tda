name: Yllith Shell Recovery

on:
  push:
    branches:
      - ops/recover-yllith-shell-site
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    env:
      R2_PUBLIC_BUCKET: tda-media-public
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Check GitHub Environment credential presence
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          ok=true
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name=missing"
              ok=false
            else
              echo "$name=present"
            fi
          done
          echo "available=$ok" >> "$GITHUB_OUTPUT"

      - name: Recover historical shell directly from R2 (read only)
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { GetObjectCommand, S3Client } from '@aws-sdk/client-s3';

          const expected = {
            'index.html': [56047, 'd37439c16dd24a39c98347e20bc76532ae75a7b09889b7aa1eb653bd4bef934a'],
            'yllith.css': [37831, '7b0440db4e7f609ab25f6e6a6c22ee393866ff2ddf542e5cbfe18910095f76ae'],
            'yllith.js': [13080, '0700e3d8c1819770b70fefcb0daeed4ec18b88f52d632ba0a9c9d52a55a98b67'],
            'favicon.svg': [585, 'e1a0be3b542499177cb57526e0a0e58d1210a5aea99a3fd6d6f61a2b416d24c6'],
            'historia.md': [16297, '33ca13c18381a977caf86c68af5f7c5c1801e9eeb6e6aca097e17d8ca1de19b1'],
          };

          const client = new S3Client({
            region: 'auto',
            endpoint: `https://${process.env.R2_ACCOUNT_ID}.r2.cloudflarestorage.com`,
            credentials: {
              accessKeyId: process.env.R2_ACCESS_KEY_ID,
              secretAccessKey: process.env.R2_SECRET_ACCESS_KEY,
            },
            requestChecksumCalculation: 'WHEN_REQUIRED',
          });

          const rows = ['file\tr2\tbytes\tsha256\tmatch'];
          for (const [file, [expectedBytes, expectedSha]] of Object.entries(expected)) {
            const key = `lore/yllith/site/${file}`;
            try {
              const result = await client.send(new GetObjectCommand({ Bucket: process.env.R2_PUBLIC_BUCKET, Key: key }));
              const bytes = Buffer.from(await result.Body.transformToByteArray());
              const sha = createHash('sha256').update(bytes).digest('hex');
              const match = bytes.length === expectedBytes && sha === expectedSha;
              if (match) fs.writeFileSync(`recovered/${file}`, bytes);
              rows.push(`${file}\tfound\t${bytes.length}\t${sha}\t${match ? 'yes' : 'no'}`);
            } catch (error) {
              rows.push(`${file}\t${error?.name || 'error'}\t-\t-\tno`);
            }
          }
          fs.writeFileSync('recovered/status.tsv', `${rows.join('\n')}\n`);
          console.log(rows.join('\n'));
          NODE

      - name: Record unavailable credentials
        if: steps.credentials.outputs.available != 'true'
        shell: bash
        run: |
          mkdir -p recovered
          printf 'GitHub production environment does not currently expose R2 read credentials.\n' > recovered/status.txt

      - name: Upload recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: yllith-shell-github-secret-recovery
          path: recovered/
          if-no-files-found: error
          retention-days: 3

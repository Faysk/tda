name: Temporary docs catalog regeneration

on:
  push:
    branches:
      - docs/reconcile-2026-09-11

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/reconcile-2026-09-11
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Regenerate documentation catalog
        run: node tools/documentation-catalog.mjs --write

      - name: Validate documentation graph
        run: node tools/check-docs.mjs

      - name: Commit generated catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/documentation/catalog.md
          if git diff --cached --quiet; then
            echo "Catalog already up to date."
            exit 0
          fi
          git commit -m "docs: regenerate documentation catalog"
          git push origin HEAD:docs/reconcile-2026-09-11

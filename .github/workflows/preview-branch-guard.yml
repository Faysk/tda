name: Preview Branch Guard

on:
  delete:

permissions:
  contents: write

concurrency:
  group: preview-branch-guard
  cancel-in-progress: false

jobs:
  restore-preview:
    name: restore-preview
    if: github.event.ref_type == 'branch' && github.event.ref == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recreate Preview from current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          MAIN_SHA="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"

          if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/Preview" >/dev/null 2>&1; then
            echo "Preview already exists; no recovery required."
            exit 0
          fi

          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref='refs/heads/Preview' \
            -f sha="$MAIN_SHA" >/dev/null

          echo "RESTORED_PREVIEW_FROM_MAIN $MAIN_SHA"

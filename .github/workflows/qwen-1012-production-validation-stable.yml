name: Qwen 1.0.12 Production Validation Stable Bridge

on:
  workflow_run:
    workflows: [Runtime RC]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      runtime_rc_run_id:
        description: Exact successful Runtime RC workflow run id
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: qwen-1012-production-validation-stable
  cancel-in-progress: false

jobs:
  publish-stable:
    name: promote exact Qwen 1.0.12 RC bytes for production validation
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_TRIGGER_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      TRIGGER_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_rc_run_id || github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_VERSION: "1.0.12"
    steps:
      - name: Validate trusted successful main Runtime RC trigger
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRIGGER_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID" > trigger-run.json
          python - <<'PY'
          import json, os
          value = json.load(open("trigger-run.json", encoding="utf-8"))
          if value.get("name") != "Runtime RC": raise SystemExit("QWEN_PRODUCTION_VALIDATION_TRIGGER_WORKFLOW_INVALID")
          expected = os.environ.get("EXPECTED_TRIGGER_HEAD_SHA", "")
          if expected and value.get("head_sha") != expected:
              raise SystemExit("QWEN_PRODUCTION_VALIDATION_TRIGGER_HEAD_MISMATCH")
          if value.get("conclusion") != "success" or value.get("status") != "completed":
              raise SystemExit("QWEN_PRODUCTION_VALIDATION_TRIGGER_NOT_SUCCESSFUL")
          if value.get("head_branch") != "main":
              raise SystemExit("QWEN_PRODUCTION_VALIDATION_TRIGGER_NOT_MAIN")
          head = value.get("head_sha")
          if not isinstance(head, str) or len(head) != 40:
              raise SystemExit("QWEN_PRODUCTION_VALIDATION_TRIGGER_HEAD_INVALID")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"TRIGGER_HEAD_SHA={head}\n")
          PY

      - name: Resolve exact Qwen Runtime RC publication marker
        id: qwen
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$TRIGGER_RUN_ID" --repo "$GITHUB_REPOSITORY" --log > runtime-rc.log
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path("runtime-rc.log").read_text(encoding="utf-8", errors="replace")
          pattern = re.compile(
              r"RUNTIME_RC_READY family=qwen "
              r"tag=(companion-qwen-runtime-rc-v([0-9]+\.[0-9]+\.[0-9]+)-([a-f0-9]{12})) "
              r"source=([a-f0-9]{40}) run=([0-9]+)"
          )
          matches = pattern.findall(text)
          if not matches:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write("present=false\n")
              raise SystemExit(0)
          if len(matches) != 1:
              raise SystemExit("QWEN_PRODUCTION_VALIDATION_RUNTIME_MARKER_AMBIGUOUS")
          tag, version, short_sha, source_sha, build_run_id = matches[0]
          if version != os.environ["EXPECTED_VERSION"]:
              raise SystemExit("QWEN_PRODUCTION_VALIDATION_RUNTIME_VERSION_MISMATCH")
          if source_sha[:12] != short_sha:
              raise SystemExit("QWEN_PRODUCTION_VALIDATION_RUNTIME_TAG_SOURCE_MISMATCH")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("present=true\n")
              handle.write(f"source_sha={source_sha}\n")
              handle.write(f"rc_tag={tag}\n")
              handle.write(f"build_run_id={build_run_id}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"SOURCE_SHA={source_sha}\n")
              handle.write(f"RC_TAG={tag}\n")
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.qwen.outputs.present == 'true'
        with:
          ref: ${{ steps.qwen.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve one-time Qwen release identities
        if: steps.qwen.outputs.present == 'true'
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import json
          print(json.load(open("local-companion/runtime/qwen-windows-x64.json", encoding="utf-8"))["version"])
          PY
          )"
          if [[ "$VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Skipping one-time Qwen bridge for version $VERSION; expected $EXPECTED_VERSION."
            exit 0
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || { echo "::error::QWEN_PRODUCTION_VALIDATION_SOURCE_NOT_MAIN_ANCESTOR"; exit 1; }
          mapfile -t QWEN_PATHS < <(python - <<'PY'
          from pathlib import Path
          paths = set()
          for name in ("qwen-runtime.yml", "qwen-runtime-package.yml"):
              value = (Path(".github/workflows") / name).read_text(encoding="utf-8")
              start = value.index("  push:")
              end = value.index("\nconcurrency:", start)
              for line in value[start:end].splitlines():
                  stripped = line.strip()
                  if stripped.startswith("- \'") or stripped.startswith('- "'):
                      paths.add(stripped[3:-1])
          paths.update({
              ".github/workflows/runtime-rc.yml",
              ".github/workflows/qwen-1012-production-validation-stable.yml",
              "local-companion/tda_companion/qwen_prefix_checkpoint.py",
              "local-companion/tda_companion/worker_event_schema.py",
          })
          for path in sorted(paths):
              print(path)
          PY
          )
          if ! git diff --quiet "$SOURCE_SHA" origin/main -- "${QWEN_PATHS[@]}"; then
            echo "::error::QWEN_PRODUCTION_VALIDATION_RUNTIME_INPUT_DRIFT"
            git diff --name-only "$SOURCE_SHA" origin/main -- "${QWEN_PATHS[@]}"
            exit 1
          fi

          EXPECTED_RC_TAG="companion-qwen-runtime-rc-v${VERSION}-${SOURCE_SHA:0:12}"
          [[ "$RC_TAG" == "$EXPECTED_RC_TAG" ]] || { echo "::error::QWEN_PRODUCTION_VALIDATION_RC_TAG_MISMATCH"; exit 1; }
          gh release view "$RC_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "rc_tag=$RC_TAG" >> "$GITHUB_OUTPUT"
          echo "stable_tag=companion-qwen-runtime-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify immutable Qwen RC release and bytes
        if: steps.qwen.outputs.present == 'true'
        shell: bash
        env:
          RC_TAG: ${{ steps.release.outputs.rc_tag }}
        run: |
          set -euo pipefail
          gh release view "$RC_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish > rc.json
          python - <<'PY'
          import json, os
          value = json.load(open("rc.json", encoding="utf-8"))
          assert value["tagName"] == os.environ["RC_TAG"]
          assert value["isDraft"] is False and value["isPrerelease"] is True
          assert value["targetCommitish"] == os.environ["SOURCE_SHA"]
          PY
          rm -rf rc-assets && mkdir rc-assets
          gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --dir rc-assets
          PYTHONPATH=local-companion python - <<'PY'
          import json, os
          from pathlib import Path
          from tda_companion.runtime_release_evidence import verify_candidate_assets
          root = Path("rc-assets")
          candidate = json.loads((root / "TDARuntime-candidate.json").read_text(encoding="utf-8"))
          assert candidate["family"] == "qwen"
          assert candidate["version"] == os.environ["EXPECTED_VERSION"]
          assert candidate["source_sha"] == os.environ["SOURCE_SHA"]
          assert candidate["candidate_tag"] == os.environ["RC_TAG"]
          verify_candidate_assets(candidate, root)
          PY

      - name: Attach production-validation override
        if: steps.qwen.outputs.present == 'true'
        shell: bash
        env:
          RC_TAG: ${{ steps.release.outputs.rc_tag }}
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          value = {
            "schema": "tda_production_validation_override_v1",
            "component": "qwen-runtime",
            "version": os.environ["EXPECTED_VERSION"],
            "source_sha": os.environ["SOURCE_SHA"],
            "candidate_tag": os.environ["RC_TAG"],
            "stable_tag": os.environ["STABLE_TAG"],
            "reason": "Owner explicitly authorized the exact Qwen 1.0.12 RC bytes to use Production as the real long-Craig acceptance environment for issue #628; unresolved failures remain fail-closed and rollback stays on 1.0.11.",
            "physical_acceptance_before_promotion": False,
            "exact_rc_bytes_reused": True,
            "recorded_at": datetime.now(timezone.utc).isoformat(),
          }
          open("TDARuntime-production-validation-override.json","w",encoding="utf-8").write(json.dumps(value,indent=2,sort_keys=True)+"\n")
          PY
          gh release upload "$RC_TAG" --repo "$GITHUB_REPOSITORY" TDARuntime-production-validation-override.json --clobber

      - name: Promote exact Qwen RC release object to Stable
        if: steps.qwen.outputs.present == 'true'
        shell: bash
        env:
          RC_TAG: ${{ steps.release.outputs.rc_tag }}
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
        run: |
          set -euo pipefail
          if gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Stable tag already exists; verifying source."
            [[ "$(gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)" == "$SOURCE_SHA" ]]
            exit 0
          fi
          cat > stable-notes.md <<EOF
          TDA Qwen Runtime v$EXPECTED_VERSION — production-validation release for #628.

          Production is the explicitly authorized real acceptance environment for this recovery.
          Exact immutable Runtime RC bytes are promoted with no rebuild.
          Source SHA: $SOURCE_SHA
          Pre-promotion physical acceptance: intentionally deferred to Production.
          EOF
          gh release edit "$RC_TAG" --repo "$GITHUB_REPOSITORY" --tag "$STABLE_TAG" --target "$SOURCE_SHA"             --title "TDA Qwen Runtime v$EXPECTED_VERSION" --notes-file stable-notes.md --prerelease=false

      - name: Verify Stable Qwen release from fresh bytes
        if: steps.qwen.outputs.present == 'true'
        shell: bash
        env:
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
        run: |
          set -euo pipefail
          rm -rf stable-assets && mkdir stable-assets
          gh release download "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --dir stable-assets
          PYTHONPATH=local-companion python - <<'PY'
          import json
          from pathlib import Path
          from tda_companion.runtime_release_evidence import verify_candidate_assets
          root = Path("stable-assets")
          candidate = json.loads((root / "TDARuntime-candidate.json").read_text(encoding="utf-8"))
          verify_candidate_assets(candidate, root)
          assert (root / "TDARuntime-production-validation-override.json").is_file()
          PY
          echo "QWEN_PRODUCTION_VALIDATION_STABLE_READY tag=$STABLE_TAG source=$SOURCE_SHA"

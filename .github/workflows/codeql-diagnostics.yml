name: CodeQL Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-diagnostics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: diagnostics (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze to local SARIF
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
          upload: false
          output: codeql-sarif

      - name: Emit compact findings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import json

          for path in sorted(glob.glob("codeql-sarif/*.sarif")):
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
              for run in payload.get("runs", []):
                  rules = {
                      rule.get("id"): rule
                      for rule in run.get("tool", {}).get("driver", {}).get("rules", [])
                      if isinstance(rule, dict)
                  }
                  for result in run.get("results", []):
                      rule_id = result.get("ruleId") or ""
                      rule = rules.get(rule_id) or {}
                      properties = rule.get("properties") or {}
                      location = {}
                      locations = result.get("locations") or []
                      if locations:
                          physical = locations[0].get("physicalLocation") or {}
                          region = physical.get("region") or {}
                          location = {
                              "path": (physical.get("artifactLocation") or {}).get("uri"),
                              "line": region.get("startLine"),
                              "column": region.get("startColumn"),
                          }
                      message = (result.get("message") or {}).get("text")
                      record = {
                          "rule_id": rule_id,
                          "name": rule.get("name"),
                          "level": result.get("level"),
                          "security_severity": properties.get("security-severity"),
                          "precision": properties.get("precision"),
                          "tags": properties.get("tags"),
                          "message": message,
                          **location,
                      }
                      print("@@CODEQL_FINDING@@ " + json.dumps(record, ensure_ascii=False, sort_keys=True))
          PY

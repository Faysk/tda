name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

      - name: Stage CodeQL SARIF for remediation
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p codeql-sarif
          cp ../results/*.sarif codeql-sarif/

      - name: Export CodeQL SARIF for remediation
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-sarif-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: codeql-sarif/*.sarif
          if-no-files-found: error
          retention-days: 1

      - name: Export open code scanning alerts for remediation
        if: ${{ always() && matrix.language == 'javascript-typescript' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p codeql-alerts
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/code-scanning/alerts?state=open&per_page=100" \
            > codeql-alerts/open-alerts.json

      - name: Upload open code scanning alerts
        if: ${{ always() && matrix.language == 'javascript-typescript' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-open-alerts-${{ github.run_id }}-${{ github.run_attempt }}
          path: codeql-alerts/open-alerts.json
          if-no-files-found: error
          retention-days: 1

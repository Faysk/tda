name: CodeQL

on:
  push:
    branches: [main, security/export-codeql-sarif]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot-open-alerts:
    name: snapshot-open-alerts
    runs-on: ubuntu-latest
    steps:
      - name: Export current open code scanning alerts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" \
            > code-scanning-open-alerts.json
      - name: Upload current open code scanning alerts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-scanning-open-alerts-${{ github.run_id }}
          path: code-scanning-open-alerts.json
          if-no-files-found: error
          retention-days: 1

  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results/${{ matrix.language }}

      - name: Upload CodeQL SARIF for remediation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-sarif-${{ matrix.language }}-${{ github.run_id }}
          path: sarif-results/${{ matrix.language }}/
          if-no-files-found: error
          retention-days: 1

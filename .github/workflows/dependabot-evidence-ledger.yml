name: Dependabot Evidence Ledger

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact completed PR CI run ID to re-evaluate after CodeQL finishes
        required: true
        type: string

# No PR head checkout, no write token, no release/dispatch/merge operations.
# workflow_run executes the reviewed default-branch workflow definition.
permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: dependabot-evidence-${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  evidence:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.name == 'CI' && github.event.workflow_run.event == 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Contract tests for stale and missing checks
        run: node --test tools/ci/bot-evidence-ledger.test.mjs
      - name: Evaluate the exact completed PR CI run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
        run: node tools/ci/bot-evidence-ledger.mjs

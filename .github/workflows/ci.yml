name: CI
on:
  push:
    branches: [main, Preview]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  transcript-import-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: pnpm exec vitest run src/features/transcript-sync/database.test.ts
        env:
          TDA_SYNTHETIC_POSTGRES: "1"
      - run: python tools/world-layout-db.py
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: python -m unittest discover -s tools/media -p test_lore_svg.py
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:processing
      - name: Capture Pipipi visual QA evidence
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 118
        run: pnpm exec playwright test tests/pipipi-visual-qa.spec.ts
        env:
          PIPIPI_CAPTURE_QA: "1"
      - name: Upload Pipipi visual QA evidence
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 118 && always()
        uses: actions/upload-artifact@v4
        with:
          name: pipipi-visual-qa
          path: .qa-artifacts/pipipi/*.png
          if-no-files-found: error
          retention-days: 1

name: Claquete Docs Generate

on:
  push:
    branches: [claquete/pipipi-100]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claquete/pipipi-100
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Regenerate documentation catalog
        run: pnpm docs:generate
      - name: Commit generated catalog and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/claquete-docs-generate.yml
          git add docs/documentation/catalog.md
          git commit -m "docs: regenerate catalog after Pipipi closeout"
          git push origin HEAD:claquete/pipipi-100

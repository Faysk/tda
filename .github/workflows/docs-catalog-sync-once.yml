name: Docs Catalog Sync Once

on:
  push:
    branches:
      - docs/cicd-operational-handoff-v1

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/cicd-operational-handoff-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Generate documentation catalog
        run: pnpm docs:generate
      - name: Commit generated catalog
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/documentation/catalog.md; then
            echo "Catalog already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/documentation/catalog.md
          git commit -m "docs: regenerate documentation catalog"
          git push origin HEAD:docs/cicd-operational-handoff-v1

name: Refresh documentation catalog
on:
  pull_request:
permissions:
  contents: write
jobs:
  refresh:
    if: github.head_ref == 'feat/global-loading-overlay' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/global-loading-overlay
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:generate
      - name: Commit generated catalog when stale
        shell: bash
        run: |
          if git diff --quiet -- docs/documentation/catalog.md; then
            echo "Catalog already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/documentation/catalog.md
          git commit -m "docs: regenerate documentation catalog"
          git push origin HEAD:feat/global-loading-overlay

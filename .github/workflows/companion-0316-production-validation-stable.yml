name: Companion 0.3.16 Production Validation Stable Bridge

on:
  workflow_run:
    workflows: [Companion RC]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: companion-0316-production-validation-stable
  cancel-in-progress: false

jobs:
  publish-stable:
    name: promote exact 0.3.16 RC bytes for production validation
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_VERSION: "0.3.16"
    steps:
      - name: Validate trusted successful main RC trigger
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$TRIGGER_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID" > trigger-run.json
          python - <<'PY'
          import json, os
          value = json.load(open("trigger-run.json", encoding="utf-8"))
          if value.get("name") != "Companion RC": raise SystemExit("PRODUCTION_VALIDATION_TRIGGER_WORKFLOW_INVALID")
          if value.get("head_sha") != os.environ["SOURCE_SHA"]: raise SystemExit("PRODUCTION_VALIDATION_TRIGGER_SOURCE_MISMATCH")
          if value.get("conclusion") != "success" or value.get("status") != "completed": raise SystemExit("PRODUCTION_VALIDATION_TRIGGER_NOT_SUCCESSFUL")
          if value.get("head_branch") != "main": raise SystemExit("PRODUCTION_VALIDATION_TRIGGER_NOT_MAIN")
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve one-time release identities
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(PYTHONPATH=local-companion python -c 'import tda_companion; print(tda_companion.VERSION)')"
          if [[ "$VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Skipping one-time Companion bridge for version $VERSION; expected $EXPECTED_VERSION."
            exit 0
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || { echo "::error::COMPANION_PRODUCTION_VALIDATION_SOURCE_NOT_MAIN_ANCESTOR"; exit 1; }
          COMPANION_PATHS=(
            ".github/workflows/companion.yml"
            ".github/workflows/companion-0316-production-validation-stable.yml"
            "local-companion/pyproject.toml"
            "local-companion/requirements-test.lock"
            "local-companion/tda_companion/**"
            "local-companion/packaging/**"
          )
          if ! git diff --quiet "$SOURCE_SHA" origin/main -- "${COMPANION_PATHS[@]}"; then
            echo "::error::COMPANION_PRODUCTION_VALIDATION_PACKAGE_INPUT_DRIFT"
            git diff --name-only "$SOURCE_SHA" origin/main -- "${COMPANION_PATHS[@]}"
            exit 1
          fi

          RC_TAG="companion-rc-v${VERSION}-${SOURCE_SHA:0:12}"
          STABLE_TAG="companion-v$VERSION"
          COMPANION_PACKAGE_PATHS=(
            ".github/workflows/companion.yml"
            "local-companion/pyproject.toml"
            "local-companion/requirements-test.lock"
            "local-companion/tda_companion/**"
            "local-companion/packaging/**"
          )

          if gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            STABLE_SOURCE="$(gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            [[ "$STABLE_SOURCE" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::COMPANION_PRODUCTION_VALIDATION_STABLE_TARGET_INVALID"; exit 1; }
            git fetch --no-tags origin "$STABLE_SOURCE"
            if ! git diff --quiet "$STABLE_SOURCE" "$SOURCE_SHA" -- "${COMPANION_PACKAGE_PATHS[@]}"; then
              echo "::error::COMPANION_PRODUCTION_VALIDATION_STABLE_PACKAGE_INPUT_DRIFT"
              git diff --name-only "$STABLE_SOURCE" "$SOURCE_SHA" -- "${COMPANION_PACKAGE_PATHS[@]}"
              exit 1
            fi
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "reuse_stable=true" >> "$GITHUB_OUTPUT"
            echo "stable_source=$STABLE_SOURCE" >> "$GITHUB_OUTPUT"
            echo "rc_tag=$RC_TAG" >> "$GITHUB_OUTPUT"
            echo "stable_tag=$STABLE_TAG" >> "$GITHUB_OUTPUT"
            echo "Stable $STABLE_TAG already exists from $STABLE_SOURCE with equivalent Companion package inputs; preserving its immutable bytes instead of republishing version $VERSION from $SOURCE_SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! gh release view "$RC_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "No immutable Companion RC release $RC_TAG was published for this successful RC workflow; Stable bridge is a no-op." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "reuse_stable=false" >> "$GITHUB_OUTPUT"
          echo "stable_source=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "rc_tag=$RC_TAG" >> "$GITHUB_OUTPUT"
          echo "stable_tag=$STABLE_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify immutable RC release and bytes
        if: steps.release.outputs.eligible == 'true' && steps.release.outputs.reuse_stable != 'true'
        shell: bash
        env:
          RC_TAG: ${{ steps.release.outputs.rc_tag }}
        run: |
          set -euo pipefail
          gh release view "$RC_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish > rc.json
          python - <<'PY'
          import json, os
          value = json.load(open("rc.json", encoding="utf-8"))
          assert value["tagName"] == os.environ["RC_TAG"]
          assert value["isDraft"] is False and value["isPrerelease"] is True
          assert value["targetCommitish"] == os.environ["SOURCE_SHA"]
          PY
          rm -rf rc-assets && mkdir rc-assets
          gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --dir rc-assets
          PYTHONPATH=local-companion python - <<'PY'
          import json, os
          from pathlib import Path
          from tda_companion.release_evidence import verify_candidate_files, verify_candidate_manifest
          root = Path("rc-assets")
          candidate = verify_candidate_manifest(json.loads((root / "TDACompanion-candidate.json").read_text(encoding="utf-8")))
          assert candidate["version"] == os.environ["EXPECTED_VERSION"]
          assert candidate["source_sha"] == os.environ["SOURCE_SHA"]
          assert candidate["tag"] == os.environ["RC_TAG"]
          verify_candidate_files(candidate, root)
          PY

      - name: Attach production-validation override
        if: steps.release.outputs.eligible == 'true' && steps.release.outputs.reuse_stable != 'true'
        shell: bash
        env:
          RC_TAG: ${{ steps.release.outputs.rc_tag }}
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          value = {
            "schema": "tda_production_validation_override_v1",
            "component": "companion",
            "version": os.environ["EXPECTED_VERSION"],
            "source_sha": os.environ["SOURCE_SHA"],
            "candidate_tag": os.environ["RC_TAG"],
            "stable_tag": os.environ["STABLE_TAG"],
            "reason": "Owner explicitly authorized the exact Companion 0.3.16 RC bytes to use Production as the real acceptance environment for issue #628 while Qwen 1.0.12 receives the long-Craig validation; rollback stays on 0.3.15.",
            "physical_acceptance_before_promotion": False,
            "exact_rc_bytes_reused": True,
            "recorded_at": datetime.now(timezone.utc).isoformat(),
          }
          open("TDACompanion-production-validation-override.json","w",encoding="utf-8").write(json.dumps(value,indent=2,sort_keys=True)+"\n")
          PY
          gh release upload "$RC_TAG" --repo "$GITHUB_REPOSITORY" TDACompanion-production-validation-override.json --clobber

      - name: Promote exact RC release object to Stable
        if: steps.release.outputs.eligible == 'true' && steps.release.outputs.reuse_stable != 'true'
        shell: bash
        env:
          RC_TAG: ${{ steps.release.outputs.rc_tag }}
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
        run: |
          set -euo pipefail
          if gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Stable tag already exists; verifying source."
            [[ "$(gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)" == "$SOURCE_SHA" ]]
            exit 0
          fi
          cat > stable-notes.md <<EOF
          TDA Companion v$EXPECTED_VERSION — production-validation release for #628.

          Production is the explicitly authorized real acceptance environment for this recovery.
          Exact immutable RC bytes are promoted with no rebuild.
          Source SHA: $SOURCE_SHA
          Pre-promotion physical acceptance: intentionally deferred to Production.
          EOF
          gh release edit "$RC_TAG" --repo "$GITHUB_REPOSITORY" --tag "$STABLE_TAG" --target "$SOURCE_SHA"             --title "TDA Companion v$EXPECTED_VERSION" --notes-file stable-notes.md --prerelease=false --latest

      - name: Verify Stable release from fresh bytes
        if: steps.release.outputs.eligible == 'true'
        shell: bash
        env:
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
          STABLE_SOURCE: ${{ steps.release.outputs.stable_source }}
        run: |
          set -euo pipefail
          gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish > stable.json
          python - <<'PY'
          import json, os
          value = json.load(open("stable.json", encoding="utf-8"))
          assert value["tagName"] == os.environ["STABLE_TAG"]
          assert value["isDraft"] is False and value["isPrerelease"] is False
          assert value["targetCommitish"] == os.environ["STABLE_SOURCE"]
          PY
          rm -rf stable-assets && mkdir stable-assets
          gh release download "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --dir stable-assets
          PYTHONPATH=local-companion python - <<'PY'
          import json, os
          from pathlib import Path
          from tda_companion.release_evidence import verify_candidate_files, verify_candidate_manifest
          root = Path("stable-assets")
          candidate = verify_candidate_manifest(json.loads((root / "TDACompanion-candidate.json").read_text(encoding="utf-8")))
          assert candidate["version"] == os.environ["EXPECTED_VERSION"]
          assert candidate["source_sha"] == os.environ["STABLE_SOURCE"]
          verify_candidate_files(candidate, root)
          assert (root / "TDACompanion-production-validation-override.json").is_file()
          PY
          echo "COMPANION_PRODUCTION_VALIDATION_STABLE_READY tag=$STABLE_TAG stable_source=$STABLE_SOURCE trigger_source=$SOURCE_SHA"

name: Companion docs sync (temporary)

on:
  push:
    branches: [codex/companion-v0.3-runtime-asr]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/companion-v0.3-runtime-asr
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:generate
      - name: Commit generated catalog when changed
        shell: bash
        run: |
          if git diff --quiet -- docs/documentation/catalog.md; then
            echo 'Catalog already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/documentation/catalog.md
          git commit -m 'docs: regenerate catalog after Companion v0.3 sync'
          git push origin HEAD:codex/companion-v0.3-runtime-asr

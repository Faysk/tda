          if ($sealStart -lt 0 -or $jsonStart -le $sealStart) { throw "PHYSICAL_SEAL_FUNCTION_NOT_FOUND" }
          $sealBody = $physicalHelper.Substring($sealStart, $jsonStart - $sealStart)
          if ($sealBody.Contains('$LASTEXITCODE')) { throw "PHYSICAL_SEAL_LASTEXITCODE_FORBIDDEN" }
          foreach ($required in @(
            'Invoke-NativeProcessExitCode',
            'RUNTIME_ACCEPTANCE_SEAL_FAILED',

            throw "GENERIC_RUNTIME_RELEASE_DIGEST_MISMATCH_ACCEPTED"
          } catch {
            if ($_.Exception.Message -eq "GENERIC_RUNTIME_RELEASE_DIGEST_MISMATCH_ACCEPTED") { throw }
          }

      - name: Smoke superseded 0.3.14 RC replacement
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $oldTag = "companion-rc-v0.3.14-018e109530ba"
          $newTag = "companion-rc-v0.3.14-1585a93235ba"
          $oldMsiSha = "87de762282f3626944d96bb49d8253692b64c3fa0c2db3c26482b30c93858ffa"
          $newMsiSha = "83c267ae14f10fda950413cab74394fc7b875225fa0e13f5123c8901f609f8c3"
          $payloadSha = "bc6ac20dbac3e0d9a31ff1cc3ff8a09e8e5b455cb644bcea00fe45f80bd34312"
          $root = Join-Path $env:RUNNER_TEMP "same-version-replacement"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $oldMsi = Join-Path $root "old.msi"
          $newMsi = Join-Path $root "new.msi"
          $payloadPath = Join-Path $root "payload.json"

          function Download-Checked([string]$Url, [string]$Path, [string]$Sha) {
            Invoke-WebRequest -UseBasicParsing -Uri $Url -OutFile $Path
            $actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Sha) { throw "SAME_VERSION_DOWNLOAD_HASH_MISMATCH" }
          }
          function Invoke-Msi([string[]]$MsiArgs, [string]$Code) {
            $p = Start-Process -FilePath "msiexec.exe" -ArgumentList $MsiArgs -Wait -PassThru
            if ([int]$p.ExitCode -notin @(0, 3010)) { throw "$($Code):$($p.ExitCode)" }
          }

          Download-Checked "https://github.com/Faysk/tda/releases/download/$oldTag/TDACompanion-x64.msi" $oldMsi $oldMsiSha
          Download-Checked "https://github.com/Faysk/tda/releases/download/$newTag/TDACompanion-x64.msi" $newMsi $newMsiSha
          Download-Checked "https://github.com/Faysk/tda/releases/download/$newTag/TDACompanion-payload-manifest.json" $payloadPath $payloadSha

          Invoke-Msi @("/i", ('"{0}"' -f $oldMsi), "/qn", "/norestart") "OLD_RC_INSTALL_FAILED"
          $productKey = "HKCU:\Software\Faysk\TDA Companion"
          $before = Get-ItemProperty -LiteralPath $productKey -ErrorAction Stop
          if ([string]$before.Version -ne "0.3.14") { throw "OLD_RC_VERSION_INVALID" }
          $productCode = [string]$before.ProductCode
          if ($productCode -notmatch '^\{[0-9A-Fa-f-]{36}\}$') { throw "OLD_RC_PRODUCT_CODE_INVALID" }

          Invoke-Msi @("/x", $productCode, "/qn", "/norestart") "OLD_RC_UNINSTALL_FAILED"
          Invoke-Msi @("/i", ('"{0}"' -f $newMsi), "/qn", "/norestart") "NEW_RC_INSTALL_FAILED"

          $payload = Get-Content -LiteralPath $payloadPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$payload.source_sha -ne "1585a93235ba2fe7c2c093ef1683f0beca5d1605") {
            throw "NEW_RC_PAYLOAD_SOURCE_INVALID"
          }
          $appRoot = Join-Path $env:LOCALAPPDATA "TDA\Companion\versions\0.3.14"
          foreach ($property in $payload.files.PSObject.Properties) {
            $target = Join-Path $appRoot $property.Name
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
              throw "NEW_RC_INSTALLED_FILE_MISSING:$($property.Name)"
            }
            if ((Get-Item -LiteralPath $target).Length -ne [int64]$property.Value.size) {
              throw "NEW_RC_INSTALLED_SIZE_MISMATCH:$($property.Name)"
            }
            $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne [string]$property.Value.sha256) {
              throw "NEW_RC_INSTALLED_HASH_MISMATCH:$($property.Name)"
            }
          }

          $after = Get-ItemProperty -LiteralPath $productKey -ErrorAction Stop
          Invoke-Msi @("/x", ([string]$after.ProductCode), "/qn", "/norestart") "NEW_RC_UNINSTALL_FAILED"
          Write-Host "Superseded same-version RC replacement: PASS" -ForegroundColor Green
      - name: Generate synthetic speech and Craig fixture
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $output = Join-Path $env:RUNNER_TEMP "tda-acceptance-fixture"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File `
            "tools/acceptance/generate-physical-acceptance-fixture.ps1" `
            -OutputRoot $output `
            -TargetSeconds 80
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify generated fixture contract
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $output = Join-Path $env:RUNNER_TEMP "tda-acceptance-fixture"
          $audio = Join-Path $output "tda-physical-acceptance-synthetic.wav"
          $craig = Join-Path $output "tda-installed-acceptance-craig.zip"
          $metadata = Join-Path $output "fixture.json"
          foreach ($path in @($audio, $craig, $metadata)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "FIXTURE_OUTPUT_MISSING"
            }
          }

          $value = Get-Content -LiteralPath $metadata -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$value.schema -ne "tda_physical_acceptance_fixture_v1") {
            throw "FIXTURE_SCHEMA_INVALID"
          }
          if ($value.synthetic -ne $true) { throw "FIXTURE_SYNTHETIC_PROOF_INVALID" }
          $duration = [double]$value.audio.duration_seconds
          if ($duration -lt 65 -or $duration -gt 180) {
            throw "FIXTURE_DURATION_INVALID"
          }

          $header = [IO.File]::ReadAllBytes($audio)
          if ($header.Length -lt 12) { throw "FIXTURE_WAV_TOO_SMALL" }
          if ([Text.Encoding]::ASCII.GetString($header, 0, 4) -ne "RIFF") {
            throw "FIXTURE_WAV_RIFF_INVALID"
          }
          if ([Text.Encoding]::ASCII.GetString($header, 8, 4) -ne "WAVE") {
            throw "FIXTURE_WAV_WAVE_INVALID"
          }

          $zip = [IO.Compression.ZipFile]::OpenRead($craig)
          try {
            if ($zip.Entries.Count -ne 1) { throw "FIXTURE_CRAIG_ENTRY_COUNT_INVALID" }
            $entry = $zip.Entries[0]
            if ($entry.FullName -ne "1-Synthetic.flac" -or $entry.Length -le 42) {
              throw "FIXTURE_CRAIG_TRACK_INVALID"
            }
            $stream = $entry.Open()
            try {
              $memory = [IO.MemoryStream]::new()
              try {
                $stream.CopyTo($memory)
                $bytes = $memory.ToArray()
              } finally {
                $memory.Dispose()
              }
            } finally {
              $stream.Dispose()
            }

            if ([Text.Encoding]::ASCII.GetString($bytes, 0, 4) -ne "fLaC") {
              throw "FIXTURE_CRAIG_FLAC_MARKER_INVALID"
            }
            if (($bytes[4] -band 0x7f) -ne 0) {
              throw "FIXTURE_CRAIG_STREAMINFO_MISSING"
            }
            $metadataLength = ([int]$bytes[5] -shl 16) -bor ([int]$bytes[6] -shl 8) -bor [int]$bytes[7]
            if ($metadataLength -ne 34) {
              throw "FIXTURE_CRAIG_STREAMINFO_LENGTH_INVALID"
            }

            [uint64]$packed = 0
            for ($index = 18; $index -le 25; $index++) {
              $packed = ($packed -shl 8) -bor [uint64]$bytes[$index]
            }
            $sampleRate = [uint64]($packed -shr 44)
            $totalSamples = [uint64]($packed -band [uint64]68719476735)
            if ($sampleRate -le 0 -or $totalSamples -le 0) {
              throw "FIXTURE_CRAIG_STREAMINFO_DURATION_INVALID"
            }
            $craigDuration = [double]$totalSamples / [double]$sampleRate
            if ($craigDuration -lt 60 -or $craigDuration -gt 180) {
              throw "FIXTURE_CRAIG_QWEN_WINDOW_TOO_SHORT"
            }

            $hasher = [Security.Cryptography.SHA256]::Create()
            try {
              $digest = $hasher.ComputeHash($bytes)
            } finally {
              $hasher.Dispose()
            }
            $sha = ([BitConverter]::ToString($digest) -replace "-", "").ToLowerInvariant()
            if (
              [string]$value.craig.embedded_flac_sha256 -notmatch '^[a-f0-9]{64}$' -or
              $sha -ne [string]$value.craig.embedded_flac_sha256
            ) {
              throw "FIXTURE_CRAIG_FLAC_HASH_INVALID"
            }
            if ([string]$value.craig.track_codec -ne "flac") {
              throw "FIXTURE_CRAIG_CODEC_INVALID"
            }
            $recordedDuration = [double]$value.craig.track_duration_seconds
            if ($recordedDuration -lt 60 -or [Math]::Abs($recordedDuration - $craigDuration) -gt 0.01) {
              throw "FIXTURE_CRAIG_DURATION_METADATA_INVALID"
            }
          } finally {
            $zip.Dispose()
          }

      - name: Verify binary-safe final handoff export
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "tda-final-handoff"
          & pwsh.exe -NoProfile -File "tools/acceptance/export-final-current-source-handoff.ps1" -HarnessRef $env:GITHUB_SHA -OutputDirectory $out
          if ($LASTEXITCODE -ne 0) { throw "HANDOFF_EXPORT_FAILED" }

          foreach ($relative in @(
            "tools/acceptance/run-processing-final-acceptance.ps1",
            "tools/acceptance/run-processing-stable-smoke.ps1",
            "tools/acceptance/run-final-current-source-acceptance.ps1",
            "tools/acceptance/run-qwen-recovery-physical-gate.ps1",
            "tools/acceptance/generate-physical-acceptance-fixture.ps1",
            "tools/acceptance/RUN-processing-final-acceptance.cmd",
            "tools/acceptance/RUN-processing-stable-smoke.cmd",
            "tools/acceptance/RUN-final-current-source-acceptance.cmd"
          )) {
            $expected = (git rev-parse "$env:GITHUB_SHA`:$relative").Trim()
            $materialized = Join-Path $out ($relative -replace '/', [IO.Path]::DirectorySeparatorChar)
            $actual = (git hash-object --no-filters $materialized).Trim()
            if ($expected -ne $actual) { throw "HANDOFF_EXACT_BLOB_MISMATCH:$relative" }
          }

          $fixture = Join-Path $out "tools\acceptance\generate-physical-acceptance-fixture.ps1"
          $bytes = [IO.File]::ReadAllBytes($fixture)
          if (@($bytes | Where-Object { $_ -gt 127 }).Count -eq 0) {
            throw "HANDOFF_NON_ASCII_REGRESSION_COVERAGE_MISSING"
          }

          $launcher = Get-Content -LiteralPath (Join-Path $out "tools\acceptance\RUN-final-current-source-acceptance.cmd") -Raw
          if (-not $launcher.Contains("pwsh.exe -NoProfile -ExecutionPolicy Bypass")) {
            throw "HANDOFF_CMD_EXECUTION_POLICY_BYPASS_MISSING"
          }

          $processingLauncher = Get-Content -LiteralPath (Join-Path $out "tools\acceptance\RUN-processing-final-acceptance.cmd") -Raw
          if (
            -not $processingLauncher.Contains("pwsh.exe -NoProfile -ExecutionPolicy Bypass") -or
            -not $processingLauncher.Contains("run-processing-final-acceptance.ps1")
          ) {
            throw "HANDOFF_PROCESSING_CMD_INVALID"
          }

          $processing = Get-Content -LiteralPath (Join-Path $out "tools\acceptance\run-processing-final-acceptance.ps1") -Raw
          foreach ($required in @(
            "run-final-current-source-acceptance.ps1",
            "run-qwen-recovery-physical-gate.ps1",
            "companion-rc-v0.3.14-74a656021208",
            "companion-qwen-runtime-rc-v1.0.10-19d9b3b64238",
            "CompanionExePath",
            "CompanionPayloadManifest",
            "QwenRuntimeCandidateManifest",
            "QwenInstalledRuntimeRoot",
            'qwen_recovery_identity = "exact_installed_rc"',
            "RELEASE_WIDE_EXACT_RC_HANDOFF_MISSING",
            "RELEASE_WIDE_ACCEPTANCE_FAILED",
            "QWEN_RECOVERY_ACCEPTANCE_FAILED",
            "PROCESSING FINAL ACCEPTANCE: PASS"
          )) {
            if (-not $processing.Contains($required)) {
              throw ("HANDOFF_PROCESSING_CONTRACT_MISSING:" + $required)
            }
          }
          foreach ($forbidden in @(
            "10784868492",
            "10785600787",
            "b2528830e7d78f21cd54e44c578fb32dc767009435fdc9ffdaf459f1056a3e4e",
            "QwenArtifactId =",
            "CompanionArtifactId ="
          )) {
            if ($processing.Contains($forbidden)) {
              throw ("HANDOFF_PROCESSING_LEGACY_ARTIFACT_PIN_PRESENT:" + $forbidden)
            }
          }

          $qwenRecovery = Get-Content -LiteralPath (Join-Path $out "tools\acceptance\run-qwen-recovery-physical-gate.ps1") -Raw
          foreach ($required in @(
            '[string]$CompanionExePath',
            '[string]$CompanionPayloadManifest',
            '[string]$QwenRuntimeCandidateManifest',
            '[string]$QwenInstalledRuntimeRoot',
            '"exact_installed_rc"',
            "EXACT_RC_QWEN_RUNTIME_IDENTITY_MISMATCH",
            "EXACT_RC_QWEN_COPY_IDENTITY_MISMATCH",
            "runtime_archive_sha256"
          )) {
            if (-not $qwenRecovery.Contains($required)) {
              throw ("QWEN_RECOVERY_EXACT_RC_CONTRACT_MISSING:" + $required)
            }
          }

          $stableLauncher = Get-Content -LiteralPath (Join-Path $out "tools\acceptance\RUN-processing-stable-smoke.cmd") -Raw
          if (
            -not $stableLauncher.Contains("pwsh.exe -NoProfile -ExecutionPolicy Bypass") -or
            -not $stableLauncher.Contains("run-processing-stable-smoke.ps1")
          ) {
            throw "HANDOFF_STABLE_SMOKE_CMD_INVALID"
          }

          $stableSmoke = Get-Content -LiteralPath (Join-Path $out "tools\acceptance\run-processing-stable-smoke.ps1") -Raw
          foreach ($required in @(
            "https://dnd.faysk.dev",
            "/api/downloads/companion/windows/manifest",
            'ExpectedStableVersion = "0.3.14"',
            'ExpectedWhisperRuntimeVersion = "1.1.5"',
            'ExpectedQwenRuntimeVersion = "1.0.10"',
            "WEB_STABLE_MSI_HASH_MISMATCH",
            "BROWSER_SESSION",
            "Idempotency-Key",
            "STABLE_SMOKE_IDEMPOTENCY_REPLAY_MISMATCH",
            "QWEN_WINDOW_TRANSCRIBED",
            "RUN_COMMIT_FENCE_WON",
            "run.json",
            "ExpectedArchiveSha256",
            "replaced_superseded_same_version",
            "tda_processing_stable_smoke_v1",
            "PROCESSING STABLE SMOKE: PASS"
          )) {
            if (-not $stableSmoke.Contains($required)) {
              throw ("HANDOFF_STABLE_SMOKE_CONTRACT_MISSING:" + $required)
            }
          }

          $manifest = Get-Content -LiteralPath (Join-Path $out "HANDOFF-MANIFEST.json") -Raw | ConvertFrom-Json
          if ([string]$manifest.schema -ne "tda_acceptance_handoff_v1" -or [string]$manifest.source_sha -ne $env:GITHUB_SHA) {
            throw "HANDOFF_MANIFEST_IDENTITY_INVALID"
          }

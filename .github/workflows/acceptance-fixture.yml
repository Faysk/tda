name: Acceptance Fixture

on:
  pull_request:
    paths:
      - "tools/acceptance/generate-physical-acceptance-fixture.ps1"
      - "tools/acceptance/run-recovery-candidate-1585a932.ps1"
      - "tools/acceptance/run-recovery-candidate-1585a932-auto.ps1"
      - "tools/acceptance/run-final-current-source-acceptance.ps1"
      - "local-companion/packaging/run-installed-acceptance.ps1"
      - ".github/workflows/acceptance-fixture.yml"
  push:
    branches: [main]
    paths:
      - "tools/acceptance/generate-physical-acceptance-fixture.ps1"
      - "tools/acceptance/run-recovery-candidate-1585a932.ps1"
      - "tools/acceptance/run-recovery-candidate-1585a932-auto.ps1"
      - "tools/acceptance/run-final-current-source-acceptance.ps1"
      - "local-companion/packaging/run-installed-acceptance.ps1"
      - ".github/workflows/acceptance-fixture.yml"

permissions:
  contents: read

jobs:
  windows:
    name: synthetic-acceptance-fixture
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Parse PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($relative in @(
            "tools/acceptance/generate-physical-acceptance-fixture.ps1",
            "tools/acceptance/run-recovery-candidate-1585a932.ps1",
            "tools/acceptance/run-recovery-candidate-1585a932-auto.ps1",
            "tools/acceptance/run-final-current-source-acceptance.ps1",
            "local-companion/packaging/run-installed-acceptance.ps1"
          )) {
            $path = Resolve-Path $relative
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Host ("PARSE_ERROR file={0} id={1} line={2} col={3} extent=[{4}] message={5}" -f
                  $relative,
                  $_.ErrorId,
                  $_.Extent.StartLineNumber,
                  $_.Extent.StartColumnNumber,
                  $_.Extent.Text,
                  $_.Message
                )
              }
              exit 1
            }
          }
      - name: Verify recovery launcher is pinned and transcript-free
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $value = Get-Content -LiteralPath "tools/acceptance/run-recovery-candidate-1585a932.ps1" -Raw
          foreach ($required in @(
            'companion-rc-v0.3.14-1585a93235ba',
            '1585a93235ba2fe7c2c093ef1683f0beca5d1605',
            '83c267ae14f10fda950413cab74394fc7b875225fa0e13f5123c8901f609f8c3',
            'bc6ac20dbac3e0d9a31ff1cc3ff8a09e8e5b455cb644bcea00fe45f80bd34312',
            '344f4d8f7c8d353699a35bd182edd1c202585affe4d6f69d257d78793bee065e'
          )) {
            if (-not $value.Contains($required)) { throw "RECOVERY_LAUNCHER_IDENTITY_MISSING" }
          }
          if ($value -match '(?i)-WriteTranscripts') { throw "RECOVERY_LAUNCHER_TRANSCRIPT_MODE_FORBIDDEN" }
          if ($value -match '(?i)companion-rc-v0\.3\.14-(?!1585a93235ba)[a-f0-9]{12}') {
            throw "RECOVERY_LAUNCHER_MULTIPLE_RC_FORBIDDEN"
          }
          if (-not $value.Contains("function Require-PowerShell7")) {
            throw "RECOVERY_LAUNCHER_POWERSHELL7_GUARD_MISSING"
          }
          if (-not $value.Contains("& $pwshPath")) {
            throw "RECOVERY_LAUNCHER_POWERSHELL7_ISOLATION_MISSING"
          }
          if ($value -notmatch '(?m)^\s*& \$pwshPath .* -File \$installedScript') {
            throw "RECOVERY_LAUNCHER_INSTALLED_CHILD_NOT_ISOLATED"
          }
          if ($value -notmatch '(?m)^\s*& \$pwshPath .* -File \$physicalScript') {
            throw "RECOVERY_LAUNCHER_PHYSICAL_CHILD_NOT_ISOLATED"
          }
          if (-not $value.Contains('Ensure-ExactCandidateInstalled $msiPath $payloadPath $Port')) {
            throw "RECOVERY_LAUNCHER_EXACT_INSTALL_MISSING"
          }
          if (-not $value.Contains("Remove-SupersededSameVersionCandidate")) {
            throw "RECOVERY_LAUNCHER_SAME_VERSION_REPLACEMENT_MISSING"
          }
          foreach ($required in @(
            '[switch]$Automated',
            'function Assert-AllProfilesReady',
            'function Ensure-AutomatedRuntimesReady',
            'function New-NoCompressionZip',
            'function Assert-NoActiveUserWorkBeforeMutation',
            'RECOVERY_ACTIVE_USER_JOB_PRESENT_BEFORE_MUTATION',
            'RECOVERY_ACTIVE_USER_PREPARATION_PRESENT_BEFORE_MUTATION',
            'RECOVERY_ACTIVE_WORK_PREFLIGHT_UNAVAILABLE',
            'function Read-RuntimeCandidateArchiveSha',
            'function Install-ExactRuntimeArtifact',
            'd4620c640ab1c5b5ebc9a96c835410eca1f16cafa3ebe0cbedc157c915137344',
            '5a794f0953f0d4f7a73c5ea991b5529a0eb594e6d055d461c1c8b9261303a285',
            'RECOVERY_RUNTIME_EXACT_IDENTITY_NOT_READY',
            'RECOVERY_RUNTIME_ROLLBACK_FAILED',
            'Ensure-ExactCandidateInstalled $msiPath $payloadPath $Port ([bool]$Automated)',
            'if (-not $AutomatedMode)',
            'Ensure-AutomatedRuntimesReady $downloads',
            'Assert-AllProfilesReady $Port',
            'Require-AllProfilesReady $Port',
            'TDAWhisperRuntime-1.1.4-windows-x64.zip.sha256',
            'fc73e48b7fc282d346398c01c23c1c45ca83d87ad57a84613f9e6d8f1118c547',
            'TDAQwenRuntimeBundle-1.0.7-windows-x64.json',
            '02f03b86e94fafb68309de563a3367183de461372f1f86f4eef2f8e0c85ead8d'
          )) {
            if (-not $value.Contains($required)) {
              throw "RECOVERY_AUTOMATED_LAUNCHER_CONTRACT_MISSING:$required"
            }
          }
          $installPrompt = '[void](Read-Host "Press ENTER to install the exact RC MSI")'
          $guard = 'if (-not $AutomatedMode)'
          $guardIndex = $value.IndexOf($guard)
          $promptIndex = $value.IndexOf($installPrompt)
          if ($guardIndex -lt 0 -or $promptIndex -lt 0 -or $guardIndex -gt $promptIndex) {
            throw "RECOVERY_AUTOMATED_INSTALL_PROMPT_NOT_GUARDED"
          }
          $runtimePrepIndex = $value.LastIndexOf('Ensure-AutomatedRuntimesReady $downloads')
          $installedPhaseIndex = $value.IndexOf('PHASE 1/2 - Installed Windows acceptance')
          $manualProfileIndex = $value.LastIndexOf('Require-AllProfilesReady $Port')
          $firstProfileAssertIndex = $value.IndexOf('Assert-AllProfilesReady $Port')
          $lastProfileAssertIndex = $value.LastIndexOf('Assert-AllProfilesReady $Port')
          $physicalPhaseIndex = $value.IndexOf('PHASE 2/2 - Physical ASR/GPU acceptance')
          if (
            $runtimePrepIndex -lt 0 -or
            $installedPhaseIndex -lt 0 -or
            $manualProfileIndex -lt 0 -or
            $firstProfileAssertIndex -lt 0 -or
            $lastProfileAssertIndex -lt 0 -or
            $physicalPhaseIndex -lt 0 -or
            $runtimePrepIndex -ge $installedPhaseIndex -or
            $firstProfileAssertIndex -le $installedPhaseIndex -or
            $firstProfileAssertIndex -ge $physicalPhaseIndex -or
            $lastProfileAssertIndex -le $physicalPhaseIndex
          ) {
            throw "RECOVERY_AUTOMATED_PROFILE_PREPARATION_ORDER_INVALID"
          }
          $preflightIndex = $value.LastIndexOf('Assert-NoActiveUserWorkBeforeMutation $Port')
          $installIndex = $value.IndexOf('Ensure-ExactCandidateInstalled $msiPath $payloadPath $Port')
          $installedPhaseIndex = $value.IndexOf("PHASE 1/2 - Installed Windows acceptance")
          if (
            $preflightIndex -lt 0 -or
            $installIndex -lt 0 -or
            $installedPhaseIndex -lt 0 -or
            $preflightIndex -ge $installIndex -or
            $installIndex -gt $installedPhaseIndex
          ) {
            throw "RECOVERY_LAUNCHER_INSTALL_ORDER_INVALID"
          }

          $installed = Get-Content -LiteralPath "local-companion/packaging/run-installed-acceptance.ps1" -Raw
          foreach ($required in @(
            "BITS job detected:",
            "Do not click prepare/install again; BITS must resume the SAME job.",
            "AGENT_RECOVERY_PID_NOT_REPLACED",
            "CRAIG_RECOVERY_PID_NOT_REPLACED"
          )) {
            if (-not $installed.Contains($required)) { throw "RECOVERY_INSTALLED_FAIL_CLOSED_MISSING" }
          }
          if (-not $value.Contains("function Test-MsiProductCode")) {
            throw "RECOVERY_PRODUCT_CODE_VALIDATOR_MISSING"
          }
          if (-not $value.Contains('[Guid]::TryParseExact($Value, "B", [ref]$parsed)')) {
            throw "RECOVERY_PRODUCT_CODE_STRUCTURAL_VALIDATION_MISSING"
          }
          if (-not $installed.Contains("[UInt64]::MaxValue")) {
            throw "RECOVERY_BITS_UNKNOWN_TOTAL_SENTINEL_MISSING"
          }
          if (-not $installed.Contains("BytesTotalKnown")) {
            throw "RECOVERY_BITS_TOTAL_KNOWN_STATE_MISSING"
          }
          if ($installed.Contains('$total = [int64]$Job.BytesTotal')) {
            throw "RECOVERY_BITS_DIRECT_INT64_CAST_PRESENT"
          }
          foreach ($required in @(
            '[switch]$Automated',
            'function Capture-AutomatedBitsResumeEvidence',
            '--acceptance-tray-exit',
            'ACTIVE_USER_JOB_PRESENT',
            'ACTIVE_USER_PREPARATION_PRESENT',
            'AGENT_INITIAL_READY_REQUIRED',
            'BITS_EVIDENCE_SUSPEND_NOT_OBSERVED',
            'function Ensure-AutomatedProfilesReady',
            'PROFILE_PREPARATION_START_INVALID',
            'PROFILE_PREPARATION_TIMEOUT',
            '[IO.File]::ReadAllBytes($settingsPath)',
            '[IO.File]::WriteAllBytes($settingsPath, $settingsOriginalBytes)',
            'LEGACY_TRAY_EQUIVALENT_SOURCE_NOT_ALLOWED',
            'FOREIGN_LISTENER_ACCEPTED_AS_AGENT',
            'WEBVIEW2_RENDERER_NOT_OBSERVED',
            'CRAIG_DID_NOT_SURVIVE_AGENT_LOSS'
          )) {
            if (-not $installed.Contains($required)) {
              throw "RECOVERY_AUTOMATED_ACCEPTANCE_CONTRACT_MISSING:$required"
            }
          }
          $autoIndex = $installed.IndexOf('if ($Automated) {')
          $manualIndex = $installed.IndexOf('$recoveryPrompt = @"')
          if ($autoIndex -lt 0 -or $manualIndex -le $autoIndex) {
            throw "RECOVERY_AUTOMATED_ACCEPTANCE_BOUNDARY_MISSING"
          }
          $autoSlice = $installed.Substring($autoIndex, $manualIndex - $autoIndex)
          if ($autoSlice.Contains("Read-Host")) {
            throw "RECOVERY_AUTOMATED_ACCEPTANCE_INTERACTIVE_PROMPT_PRESENT"
          }
          $wrapper = Get-Content -LiteralPath "tools/acceptance/run-recovery-candidate-1585a932-auto.ps1" -Raw
          foreach ($required in @(
            '"-Automated"',
            'TDA-AUTO-ACCEPTANCE-RESULTS-',
            'AUTO-RESULT.json',
            'EVIDENCE-MANIFEST.json',
            'contains_token = $false',
            'contains_audio = $false',
            'contains_transcript = $false',
            'AUTO_ACCEPTANCE_REQUIRED_RECEIPTS_MISSING',
            'AUTO_ACCEPTANCE_EVIDENCE_ZIP_FAILED',
            'harness_wrapper_sha256',
            'harness_launcher_sha256',
            '$zipPath.partial.zip',
            'Compress-Archive'
          )) {
            if (-not $wrapper.Contains($required)) {
              throw "RECOVERY_AUTOMATED_WRAPPER_CONTRACT_MISSING:$required"
            }
          }
          if ($wrapper.Contains("Read-Host")) {
            throw "RECOVERY_AUTOMATED_WRAPPER_INTERACTIVE_PROMPT_PRESENT"
          }
          $generic = Get-Content -LiteralPath "tools/acceptance/run-final-current-source-acceptance.ps1" -Raw
          foreach ($required in @(
            '[string]$CompanionRcTag',
            '[string]$WhisperRuntimeRcTag',
            '[string]$QwenRuntimeRcTag',
            '[switch]$RequireAuthenticode',
            '[string]$ExpectedSignerThumbprint',
            '[string]$ExpectedSignerSubject',
            'AUTHENTICODE_EXPECTED_SUBJECT_REQUIRED',
            'AUTHENTICODE_TIMESTAMP_MISSING',
            'Assert-NoActiveUserWork',
            'Ensure-Companion',
            'Install-Runtime',
            '"-Automated"',
            'WhisperRuntimeCandidateManifest',
            'QwenRuntimeCandidateManifest',
            'RuntimeAcceptanceOutputRoot',
            'tda_runtime_physical_acceptance_v1',
            'TDA-FINAL-ACCEPTANCE-RESULTS-',
            'contains_token=$false',
            'contains_audio=$false',
            'contains_transcript=$false'
          )) {
            if (-not $generic.Contains($required)) {
              throw "FINAL_CURRENT_SOURCE_RUNNER_CONTRACT_MISSING:$required"
            }
          }
          if ($generic.Contains("Read-Host")) {
            throw "FINAL_CURRENT_SOURCE_RUNNER_INTERACTIVE_PROMPT_PRESENT"
          }
          $preflightIndex = $generic.LastIndexOf('$phase="active_work_preflight";Assert-NoActiveUserWork')
          $installIndex = $generic.LastIndexOf('$exe=Ensure-Companion')
          if ($preflightIndex -lt 0 -or $installIndex -lt 0 -or $preflightIndex -ge $installIndex) {
            throw "FINAL_CURRENT_SOURCE_PREFLIGHT_ORDER_INVALID"
          }
      - name: Unit-test physical acceptance helper edge cases
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          function Get-FunctionScriptBlock([string]$Path, [string]$Name) {
            $tokens = $null
            $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $Path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) { throw "ACCEPTANCE_HELPER_PARSE_FAILED:$Name" }
            $functionAst = $ast.Find({
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq $Name
            }, $true)
            if ($null -eq $functionAst) { throw "ACCEPTANCE_HELPER_NOT_FOUND:$Name" }
            return [scriptblock]::Create($functionAst.Extent.Text)
          }

          . (Get-FunctionScriptBlock "tools/acceptance/run-recovery-candidate-1585a932.ps1" "Test-MsiProductCode")
          if (-not (Test-MsiProductCode "{EAC99465-E800-40A1-9F46-222A68163AFE}")) {
            throw "PRODUCT_CODE_VALID_GUID_REJECTED"
          }
          foreach ($invalid in @(
            "EAC99465-E800-40A1-9F46-222A68163AFE",
            "{not-a-guid}",
            "{EAC99465-E800-40A1-9F46-222A68163AF}",
            ""
          )) {
            if (Test-MsiProductCode $invalid) {
              throw "PRODUCT_CODE_INVALID_VALUE_ACCEPTED:$invalid"
            }
          }

          . (Get-FunctionScriptBlock "local-companion/packaging/run-installed-acceptance.ps1" "Get-TdaBitsSnapshot")
          $local = Join-Path $env:LOCALAPPDATA "TDA\Cache\acceptance-fixture.bin"
          $job = [pscustomobject]@{
            FileList = @([pscustomobject]@{
              RemoteName = "https://github.com/Faysk/tda/releases/download/test/asset.bin"
              LocalName = $local
            })
            JobId = [Guid]::NewGuid()
            JobState = "Connecting"
            BytesTransferred = [uint64]0
            BytesTotal = [UInt64]::MaxValue
          }

          $unknown = Get-TdaBitsSnapshot $job
          if ($unknown.BytesTotalKnown -ne $false) { throw "BITS_UNKNOWN_TOTAL_MARKED_KNOWN" }
          if ($null -ne $unknown.BytesTotal) { throw "BITS_UNKNOWN_TOTAL_MATERIALIZED" }
          if ([int64]$unknown.BytesTransferred -ne 0) { throw "BITS_UNKNOWN_TRANSFERRED_INVALID" }

          $job.BytesTransferred = [uint64]1120
          $job.BytesTotal = [uint64]1992294400
          $job.JobState = "Transferring"
          $known = Get-TdaBitsSnapshot $job
          if ($known.BytesTotalKnown -ne $true) { throw "BITS_FINITE_TOTAL_NOT_MARKED_KNOWN" }
          if ([int64]$known.BytesTransferred -ne 1120) { throw "BITS_FINITE_TRANSFERRED_INVALID" }
          if ([int64]$known.BytesTotal -ne 1992294400) { throw "BITS_FINITE_TOTAL_INVALID" }

          $job.BytesTotal = [uint64]0
          try {
            [void](Get-TdaBitsSnapshot $job)
            throw "BITS_ZERO_TOTAL_ACCEPTED"
          } catch {
            if ($_.Exception.Message -ne "BITS_EVIDENCE_BYTES_OUT_OF_RANGE") { throw }
          }


          . (Get-FunctionScriptBlock "tools/acceptance/run-recovery-candidate-1585a932.ps1" "New-NoCompressionZip")
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $outerRoot = Join-Path $env:RUNNER_TEMP "tda-runtime-outer-shape"
          Remove-Item -LiteralPath $outerRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $outerRoot | Out-Null

          $whisperInner = "TDAWhisperRuntime-1.1.4-windows-x64.zip"
          $whisperDigest = "$whisperInner.sha256"
          [IO.File]::WriteAllBytes((Join-Path $outerRoot $whisperInner), [byte[]](1,2,3,4))
          Set-Content -LiteralPath (Join-Path $outerRoot $whisperDigest) -Value ("0" * 64 + "  " + $whisperInner) -Encoding ASCII -NoNewline
          $whisperOuter = Join-Path $env:RUNNER_TEMP "whisper-actions-artifact.zip"
          New-NoCompressionZip $outerRoot $whisperOuter @($whisperInner, $whisperDigest)
          $whisperZip = [IO.Compression.ZipFile]::OpenRead($whisperOuter)
          try {
            $names = @($whisperZip.Entries | ForEach-Object { $_.FullName })
            if ($names.Count -ne 2 -or $whisperInner -notin $names -or $whisperDigest -notin $names) {
              throw "WHISPER_OUTER_ARTIFACT_SHAPE_INVALID"
            }
          } finally {
            $whisperZip.Dispose()
          }

          Remove-Item -LiteralPath $outerRoot -Recurse -Force
          New-Item -ItemType Directory -Force -Path $outerRoot | Out-Null
          $bundle = "TDAQwenRuntimeBundle-1.0.7-windows-x64.json"
          $part1 = "TDAQwenRuntime-1.0.7-windows-x64.zip.part001"
          $part2 = "TDAQwenRuntime-1.0.7-windows-x64.zip.part002"
          Set-Content -LiteralPath (Join-Path $outerRoot $bundle) -Value "{}" -Encoding UTF8 -NoNewline
          [IO.File]::WriteAllBytes((Join-Path $outerRoot $part1), [byte[]](5,6))
          [IO.File]::WriteAllBytes((Join-Path $outerRoot $part2), [byte[]](7,8))
          $qwenOuter = Join-Path $env:RUNNER_TEMP "qwen-actions-artifact.zip"
          New-NoCompressionZip $outerRoot $qwenOuter @($bundle, $part1, $part2)
          $qwenZip = [IO.Compression.ZipFile]::OpenRead($qwenOuter)
          try {
            $names = @($qwenZip.Entries | ForEach-Object { $_.FullName })
            if ($names.Count -ne 3 -or $bundle -notin $names -or $part1 -notin $names -or $part2 -notin $names) {
              throw "QWEN_OUTER_ARTIFACT_SHAPE_INVALID"
            }
          } finally {
            $qwenZip.Dispose()
          }

          . (Get-FunctionScriptBlock "tools/acceptance/run-recovery-candidate-1585a932.ps1" "Read-Json")
          . (Get-FunctionScriptBlock "tools/acceptance/run-recovery-candidate-1585a932.ps1" "Get-Sha256")
          . (Get-FunctionScriptBlock "tools/acceptance/run-recovery-candidate-1585a932.ps1" "Read-RuntimeCandidateArchiveSha")
          . (Get-FunctionScriptBlock "tools/acceptance/run-recovery-candidate-1585a932.ps1" "Test-RuntimeReady")

          $candidatePath = Join-Path $env:RUNNER_TEMP "runtime-candidate-synthetic.json"
          $expectedArchive = "b" * 64
          [ordered]@{
            schema = "tda_runtime_candidate_v1"
            family = "whisper"
            runtime_id = "whisper-ctranslate2"
            platform = "windows-x64"
            version = "1.1.4"
            candidate_tag = "companion-whisper-runtime-rc-v1.1.4-test"
            runtime_archive_sha256 = $expectedArchive
            assets = @(
              [ordered]@{ name = "runtime.zip"; sha256 = ("c" * 64) }
            )
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $candidatePath -Encoding UTF8

          $resolvedArchive = Read-RuntimeCandidateArchiveSha $candidatePath "whisper" "1.1.4" "whisper-ctranslate2" "companion-whisper-runtime-rc-v1.1.4-test" @{ "runtime.zip" = ("c" * 64) }
          if ($resolvedArchive -ne $expectedArchive) {
            throw "RUNTIME_CANDIDATE_ARCHIVE_IDENTITY_INVALID"
          }

          $savedLocalAppData = $env:LOCALAPPDATA
          $fakeLocal = Join-Path $env:RUNNER_TEMP "runtime-identity-localappdata"
          try {
            $env:LOCALAPPDATA = $fakeLocal
            $versionRoot = Join-Path $fakeLocal "TDA\Runtime\whisper\1.1.4"
            New-Item -ItemType Directory -Force -Path $versionRoot | Out-Null
            $worker = Join-Path $versionRoot "TDAWhisperWorker.exe"
            [IO.File]::WriteAllBytes($worker, [byte[]](10,20,30,40))
            $workerSha = (Get-FileHash -LiteralPath $worker -Algorithm SHA256).Hash.ToLowerInvariant()

            [ordered]@{
              schema = "tda_asr_runtime_v1"
              runtime_id = "whisper-ctranslate2"
              version = "1.1.4"
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path (Split-Path $versionRoot -Parent) "current.json") -Encoding UTF8

            [ordered]@{
              schema = "tda_asr_runtime_v1"
              runtime_id = "whisper-ctranslate2"
              version = "1.1.4"
              worker = "TDAWhisperWorker.exe"
              worker_sha256 = $workerSha
              archive_sha256 = ("a" * 64)
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $versionRoot ".tda-runtime.json") -Encoding UTF8

            if (Test-RuntimeReady "whisper" "1.1.4" "whisper-ctranslate2" "TDAWhisperWorker.exe" $expectedArchive) {
              throw "RUNTIME_SAME_VERSION_DIFFERENT_ARCHIVE_REUSED"
            }

            $markerPath = Join-Path $versionRoot ".tda-runtime.json"
            $marker = Get-Content -LiteralPath $markerPath -Raw -Encoding UTF8 | ConvertFrom-Json
            $marker.archive_sha256 = $expectedArchive
            $marker | ConvertTo-Json | Set-Content -LiteralPath $markerPath -Encoding UTF8
            if (-not (Test-RuntimeReady "whisper" "1.1.4" "whisper-ctranslate2" "TDAWhisperWorker.exe" $expectedArchive)) {
              throw "RUNTIME_EXACT_ARCHIVE_NOT_REUSED"
            }
          } finally {
            $env:LOCALAPPDATA = $savedLocalAppData
          }
          . (Get-FunctionScriptBlock "tools/acceptance/run-final-current-source-acceptance.ps1" "Get-ReleaseAsset")
          . (Get-FunctionScriptBlock "tools/acceptance/run-final-current-source-acceptance.ps1" "Assert-RuntimeCandidate")

          $sourceSha = "a" * 40
          $assetSha = "b" * 64
          $digestSha = "c" * 64
          $runtimeArchive = "d" * 64
          $runtimeTag = "companion-whisper-runtime-rc-v1.1.4-" + $sourceSha.Substring(0, 12)
          $release = [pscustomobject]@{
            target_commitish = $sourceSha
            assets = @(
              [pscustomobject]@{
                name = "TDAWhisperRuntime-1.1.4-windows-x64.zip"
                digest = "sha256:$assetSha"
                size = 4
                browser_download_url = "https://github.com/Faysk/tda/releases/download/$runtimeTag/TDAWhisperRuntime-1.1.4-windows-x64.zip"
              },
              [pscustomobject]@{
                name = "TDAWhisperRuntime-1.1.4-windows-x64.zip.sha256"
                digest = "sha256:$digestSha"
                size = 64
                browser_download_url = "https://github.com/Faysk/tda/releases/download/$runtimeTag/TDAWhisperRuntime-1.1.4-windows-x64.zip.sha256"
              }
            )
          }
          $candidate = [pscustomobject]@{
            schema = "tda_runtime_candidate_v1"
            family = "whisper"
            runtime_id = "whisper-ctranslate2"
            platform = "windows-x64"
            version = "1.1.4"
            source_sha = $sourceSha
            source_tree_sha = ("e" * 40)
            candidate_tag = $runtimeTag
            runtime_archive_sha256 = $runtimeArchive
            assets = @(
              [pscustomobject]@{ name = "TDAWhisperRuntime-1.1.4-windows-x64.zip"; sha256 = $assetSha },
              [pscustomobject]@{ name = "TDAWhisperRuntime-1.1.4-windows-x64.zip.sha256"; sha256 = $digestSha }
            )
          }
          Assert-RuntimeCandidate $candidate $release $runtimeTag "whisper"

          $candidate.runtime_archive_sha256 = "bad"
          try {
            Assert-RuntimeCandidate $candidate $release $runtimeTag "whisper"
            throw "GENERIC_RUNTIME_INVALID_ARCHIVE_ACCEPTED"
          } catch {
            if ($_.Exception.Message -eq "GENERIC_RUNTIME_INVALID_ARCHIVE_ACCEPTED") { throw }
          }
          $candidate.runtime_archive_sha256 = $runtimeArchive

          $release.assets[0].digest = "sha256:" + ("f" * 64)
          try {
            Assert-RuntimeCandidate $candidate $release $runtimeTag "whisper"
            throw "GENERIC_RUNTIME_RELEASE_DIGEST_MISMATCH_ACCEPTED"
          } catch {
            if ($_.Exception.Message -eq "GENERIC_RUNTIME_RELEASE_DIGEST_MISMATCH_ACCEPTED") { throw }
          }

      - name: Smoke superseded 0.3.14 RC replacement
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $oldTag = "companion-rc-v0.3.14-018e109530ba"
          $newTag = "companion-rc-v0.3.14-1585a93235ba"
          $oldMsiSha = "87de762282f3626944d96bb49d8253692b64c3fa0c2db3c26482b30c93858ffa"
          $newMsiSha = "83c267ae14f10fda950413cab74394fc7b875225fa0e13f5123c8901f609f8c3"
          $payloadSha = "bc6ac20dbac3e0d9a31ff1cc3ff8a09e8e5b455cb644bcea00fe45f80bd34312"
          $root = Join-Path $env:RUNNER_TEMP "same-version-replacement"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $oldMsi = Join-Path $root "old.msi"
          $newMsi = Join-Path $root "new.msi"
          $payloadPath = Join-Path $root "payload.json"

          function Download-Checked([string]$Url, [string]$Path, [string]$Sha) {
            Invoke-WebRequest -UseBasicParsing -Uri $Url -OutFile $Path
            $actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Sha) { throw "SAME_VERSION_DOWNLOAD_HASH_MISMATCH" }
          }
          function Invoke-Msi([string[]]$MsiArgs, [string]$Code) {
            $p = Start-Process -FilePath "msiexec.exe" -ArgumentList $MsiArgs -Wait -PassThru
            if ([int]$p.ExitCode -notin @(0, 3010)) { throw "$($Code):$($p.ExitCode)" }
          }

          Download-Checked "https://github.com/Faysk/tda/releases/download/$oldTag/TDACompanion-x64.msi" $oldMsi $oldMsiSha
          Download-Checked "https://github.com/Faysk/tda/releases/download/$newTag/TDACompanion-x64.msi" $newMsi $newMsiSha
          Download-Checked "https://github.com/Faysk/tda/releases/download/$newTag/TDACompanion-payload-manifest.json" $payloadPath $payloadSha

          Invoke-Msi @("/i", ('"{0}"' -f $oldMsi), "/qn", "/norestart") "OLD_RC_INSTALL_FAILED"
          $productKey = "HKCU:\Software\Faysk\TDA Companion"
          $before = Get-ItemProperty -LiteralPath $productKey -ErrorAction Stop
          if ([string]$before.Version -ne "0.3.14") { throw "OLD_RC_VERSION_INVALID" }
          $productCode = [string]$before.ProductCode
          if ($productCode -notmatch '^\{[0-9A-Fa-f-]{36}\}$') { throw "OLD_RC_PRODUCT_CODE_INVALID" }

          Invoke-Msi @("/x", $productCode, "/qn", "/norestart") "OLD_RC_UNINSTALL_FAILED"
          Invoke-Msi @("/i", ('"{0}"' -f $newMsi), "/qn", "/norestart") "NEW_RC_INSTALL_FAILED"

          $payload = Get-Content -LiteralPath $payloadPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$payload.source_sha -ne "1585a93235ba2fe7c2c093ef1683f0beca5d1605") {
            throw "NEW_RC_PAYLOAD_SOURCE_INVALID"
          }
          $appRoot = Join-Path $env:LOCALAPPDATA "TDA\Companion\versions\0.3.14"
          foreach ($property in $payload.files.PSObject.Properties) {
            $target = Join-Path $appRoot $property.Name
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
              throw "NEW_RC_INSTALLED_FILE_MISSING:$($property.Name)"
            }
            if ((Get-Item -LiteralPath $target).Length -ne [int64]$property.Value.size) {
              throw "NEW_RC_INSTALLED_SIZE_MISMATCH:$($property.Name)"
            }
            $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne [string]$property.Value.sha256) {
              throw "NEW_RC_INSTALLED_HASH_MISMATCH:$($property.Name)"
            }
          }

          $after = Get-ItemProperty -LiteralPath $productKey -ErrorAction Stop
          Invoke-Msi @("/x", ([string]$after.ProductCode), "/qn", "/norestart") "NEW_RC_UNINSTALL_FAILED"
          Write-Host "Superseded same-version RC replacement: PASS" -ForegroundColor Green
      - name: Generate synthetic speech and Craig fixture
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $output = Join-Path $env:RUNNER_TEMP "tda-acceptance-fixture"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File `
            "tools/acceptance/generate-physical-acceptance-fixture.ps1" `
            -OutputRoot $output `
            -TargetSeconds 80
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify generated fixture contract
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $output = Join-Path $env:RUNNER_TEMP "tda-acceptance-fixture"
          $audio = Join-Path $output "tda-physical-acceptance-synthetic.wav"
          $craig = Join-Path $output "tda-installed-acceptance-craig.zip"
          $metadata = Join-Path $output "fixture.json"
          foreach ($path in @($audio, $craig, $metadata)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "FIXTURE_OUTPUT_MISSING"
            }
          }

          $value = Get-Content -LiteralPath $metadata -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$value.schema -ne "tda_physical_acceptance_fixture_v1") {
            throw "FIXTURE_SCHEMA_INVALID"
          }
          if ($value.synthetic -ne $true) { throw "FIXTURE_SYNTHETIC_PROOF_INVALID" }
          $duration = [double]$value.audio.duration_seconds
          if ($duration -lt 65 -or $duration -gt 180) {
            throw "FIXTURE_DURATION_INVALID"
          }

          $header = [IO.File]::ReadAllBytes($audio)
          if ($header.Length -lt 12) { throw "FIXTURE_WAV_TOO_SMALL" }
          if ([Text.Encoding]::ASCII.GetString($header, 0, 4) -ne "RIFF") {
            throw "FIXTURE_WAV_RIFF_INVALID"
          }
          if ([Text.Encoding]::ASCII.GetString($header, 8, 4) -ne "WAVE") {
            throw "FIXTURE_WAV_WAVE_INVALID"
          }

          $zip = [IO.Compression.ZipFile]::OpenRead($craig)
          try {
            if ($zip.Entries.Count -ne 1) { throw "FIXTURE_CRAIG_ENTRY_COUNT_INVALID" }
            $entry = $zip.Entries[0]
            if ($entry.FullName -ne "1-Synthetic.flac" -or $entry.Length -le 0) {
              throw "FIXTURE_CRAIG_TRACK_INVALID"
            }
            $stream = $entry.Open()
            try {
              $memory = [IO.MemoryStream]::new()
              try {
                $stream.CopyTo($memory)
                $bytes = $memory.ToArray()
              } finally {
                $memory.Dispose()
              }
            } finally {
              $stream.Dispose()
            }
            $hasher = [Security.Cryptography.SHA256]::Create()
            try {
              $digest = $hasher.ComputeHash($bytes)
            } finally {
              $hasher.Dispose()
            }
            $sha = ([BitConverter]::ToString($digest) -replace "-", "").ToLowerInvariant()
            if ($sha -ne "de19f01df8995d8841b27397dcaa034a03936a45779886a66b3330781ecf48f1") {
              throw "FIXTURE_CRAIG_FLAC_HASH_INVALID"
            }
          } finally {
            $zip.Dispose()
          }

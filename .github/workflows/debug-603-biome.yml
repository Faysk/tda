name: Debug 603 Biome

on:
  pull_request:
    paths:
      - "src/features/edit/processing/**"
      - "tests/processing/**"
      - ".github/workflows/debug-603-biome.yml"

permissions:
  contents: read

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Lint only files changed by issue 603
        run: >
          pnpm exec biome lint
          src/features/edit/processing/job-timing.test.ts
          src/features/edit/processing/panel.tsx
          src/features/edit/processing/processing.module.css
          src/features/edit/processing/protocol.ts
          src/features/edit/processing/queue-model.test.ts
          tests/processing/panel.spec.ts
          --max-diagnostics=200

name: Companion
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact repository source SHA to validate and package
        required: false
        type: string
  workflow_dispatch:
permissions:
  contents: read
env:
  TDA_SOURCE_SHA: ${{ github.event_name == 'workflow_call' && inputs.source_sha || github.sha }}
jobs:
  synthetic:
    strategy:
      matrix:
        include:
          - os: windows-latest
            python: .venv/Scripts/python.exe
          - os: ubuntu-latest
            python: .venv/bin/python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TDA_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TDA_SOURCE_SHA"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
      - run: uv venv --python 3.12.14
      - run: uv pip install -c local-companion/requirements-test.lock -e ./local-companion[test]
      - run: ${{ matrix.python }} local-companion/packaging/verify_dependency_lock.py local-companion/requirements-test.lock
      - run: ${{ matrix.python }} -m pytest local-companion/tests -q
      - run: uv build local-companion --wheel --out-dir wheelhouse
      - name: Installation plan safety check
        shell: pwsh
        run: ./local-companion/packaging/plan.ps1 -InstallRoot '${{ runner.temp }}/tda-app' -DataRoot '${{ runner.temp }}/tda-data'

  windows-app:
    name: windows-installer (TDACompanion-x64.msi)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TDA_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:TDA_SOURCE_SHA.ToLowerInvariant()) { throw "BUILD_SOURCE_SHA_MISMATCH:$actual" }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
      - run: uv venv --python 3.12.14
      - run: uv pip install -c local-companion/requirements-test.lock -e ./local-companion[test,packaging,desktop]
      - run: .venv/Scripts/python.exe local-companion/packaging/verify_dependency_lock.py local-companion/requirements-test.lock --require-all
      - name: Validate PowerShell harness syntax
        shell: pwsh
        run: |
          foreach ($script in @(
            "local-companion/packaging/build-windows.ps1",
            "local-companion/packaging/plan.ps1",
            "local-companion/packaging/install-rc-runtimes.ps1",
            "local-companion/packaging/run-physical-acceptance.ps1",
            "local-companion/packaging/run-installed-acceptance.ps1",
            "local-companion/packaging/run-recovery-acceptance.ps1",
            "local-companion/packaging/smoke-windows-lifecycle.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              throw "POWERSHELL_HARNESS_INVALID"
            }
          }
      - name: Validate signing provider fail-closed contracts
        shell: pwsh
        run: |
          function Assert-BuildFails([hashtable]$Parameters, [string]$ExpectedCode) {
            $caught = ""
            try {
              & ./local-companion/packaging/build-windows.ps1 @Parameters
            } catch {
              $caught = [string]$_.Exception.Message
            }
            if ($caught -ne $ExpectedCode) {
              throw ("SIGNING_FAIL_CLOSED_MISMATCH:{0}:{1}" -f $ExpectedCode, $caught)
            }
          }

          Assert-BuildFails @{
            AuthenticodeProvider = "none"
            RequireAuthenticode = $true
          } "AUTHENTICODE_REQUIRED"

          Assert-BuildFails @{
            AuthenticodeProvider = "certificate-store"
            AuthenticodeThumbprint = "not-a-thumbprint"
          } "AUTHENTICODE_THUMBPRINT_INVALID"

          Assert-BuildFails @{
            AuthenticodeProvider = "artifact-signing"
            AuthenticodeTimestampUrl = "https://timestamp.acs.microsoft.com/"
            AuthenticodeExpectedSubject = "CN=TDA Acceptance Fixture"
          } "AUTHENTICODE_ARTIFACT_SIGNING_DLIB_REQUIRED"


          $probeDlib = Join-Path $env:RUNNER_TEMP "artifact-signing-probe.dlib"
          Set-Content -LiteralPath $probeDlib -Value "fixture" -Encoding Ascii

          $badEndpointMetadata = Join-Path $env:RUNNER_TEMP "artifact-signing-bad-endpoint.json"
          @{
            Endpoint = "https://example.invalid/"
            CodeSigningAccountName = "tdaacceptance"
            CertificateProfileName = "tda-acceptance"
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath $badEndpointMetadata -Encoding UTF8
          Assert-BuildFails @{
            AuthenticodeProvider = "artifact-signing"
            AuthenticodeTimestampUrl = "https://timestamp.acs.microsoft.com/"
            AuthenticodeExpectedSubject = "CN=TDA Acceptance Fixture"
            AuthenticodeArtifactSigningDlib = $probeDlib
            AuthenticodeArtifactSigningMetadata = $badEndpointMetadata
          } "AUTHENTICODE_ARTIFACT_SIGNING_ENDPOINT_INVALID"

          $badCredentialMetadata = Join-Path $env:RUNNER_TEMP "artifact-signing-bad-credential.json"
          @{
            Endpoint = "https://weu.codesigning.azure.net/"
            CodeSigningAccountName = "tdaacceptance"
            CertificateProfileName = "tda-acceptance"
            ExcludeCredentials = @("DefinitelyNotACredential")
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath $badCredentialMetadata -Encoding UTF8
          Assert-BuildFails @{
            AuthenticodeProvider = "artifact-signing"
            AuthenticodeTimestampUrl = "https://timestamp.acs.microsoft.com/"
            AuthenticodeExpectedSubject = "CN=TDA Acceptance Fixture"
            AuthenticodeArtifactSigningDlib = $probeDlib
            AuthenticodeArtifactSigningMetadata = $badCredentialMetadata
          } "AUTHENTICODE_ARTIFACT_SIGNING_EXCLUDE_CREDENTIALS_INVALID"


          $stringCredentialMetadata = Join-Path $env:RUNNER_TEMP "artifact-signing-string-credential.json"
          @{
            Endpoint = "https://weu.codesigning.azure.net/"
            CodeSigningAccountName = "tda-acceptance"
            CertificateProfileName = "tda-acceptance"
            ExcludeCredentials = "AzureCliCredential"
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath $stringCredentialMetadata -Encoding UTF8
          Assert-BuildFails @{
            AuthenticodeProvider = "artifact-signing"
            AuthenticodeTimestampUrl = "https://timestamp.acs.microsoft.com/"
            AuthenticodeExpectedSubject = "CN=TDA Acceptance Fixture"
            AuthenticodeArtifactSigningDlib = $probeDlib
            AuthenticodeArtifactSigningMetadata = $stringCredentialMetadata
          } "AUTHENTICODE_ARTIFACT_SIGNING_EXCLUDE_CREDENTIALS_INVALID"

          $unknownKeyMetadata = Join-Path $env:RUNNER_TEMP "artifact-signing-unknown-key.json"
          @{
            Endpoint = "https://weu.codesigning.azure.net/"
            CodeSigningAccountName = "tdaacceptance"
            CertificateProfileName = "tda-acceptance"
            ClientSecret = "must-never-be-accepted"
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath $unknownKeyMetadata -Encoding UTF8
          Assert-BuildFails @{
            AuthenticodeProvider = "artifact-signing"
            AuthenticodeTimestampUrl = "https://timestamp.acs.microsoft.com/"
            AuthenticodeExpectedSubject = "CN=TDA Acceptance Fixture"
            AuthenticodeArtifactSigningDlib = $probeDlib
            AuthenticodeArtifactSigningMetadata = $unknownKeyMetadata
          } "AUTHENTICODE_ARTIFACT_SIGNING_METADATA_KEY_INVALID"
      - name: Install WiX Toolset 5
        shell: pwsh
        run: dotnet tool install --tool-path .wix wix --version 5.0.2
      - name: Build Windows bundle and MSI
        shell: pwsh
        run: ./local-companion/packaging/build-windows.ps1
      - name: Generate exact payload evidence
        shell: pwsh
        run: |
          $version = (& .venv/Scripts/python.exe -c "import tda_companion; print(tda_companion.VERSION)").Trim()
          $tree = (git rev-parse "HEAD^{tree}").Trim().ToLowerInvariant()
          .venv/Scripts/python.exe -m tda_companion.payload_evidence `
            --app-root "local-companion/out/windows/TDACompanion-$version/app" `
            --version $version `
            --source-sha $env:TDA_SOURCE_SHA `
            --source-tree-sha $tree `
            --output "local-companion/out/windows/TDACompanion-payload-manifest.json"
      - name: Smoke packaged executable
        shell: pwsh
        run: |
          $version = (& .venv/Scripts/python.exe -c "import tda_companion; print(tda_companion.VERSION)").Trim()
          ./local-companion/packaging/smoke-windows-bundle.ps1 -PackageRoot "local-companion/out/windows/TDACompanion-$version"
      - name: Smoke MSI install and uninstall
        shell: pwsh
        run: |
          $version = (& .venv/Scripts/python.exe -c "import tda_companion; print(tda_companion.VERSION)").Trim()
          ./local-companion/packaging/smoke-windows-msi.ps1 -MsiPath "local-companion/out/windows/TDACompanion-x64.msi" -Version $version
      - name: Smoke rollback, real upgrade, preserve uninstall and purge
        shell: pwsh
        run: |
          $version = (& .venv/Scripts/python.exe -c "import tda_companion; print(tda_companion.VERSION)").Trim()
          ./local-companion/packaging/smoke-windows-lifecycle.ps1 `
            -CurrentMsiPath "local-companion/out/windows/TDACompanion-x64.msi" `
            -RollbackProbeMsiPath "local-companion/out/windows/TDACompanion-rollback-probe-x64.msi" `
            -CurrentVersion $version
      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TDACompanion-windows-x64
          path: |
            local-companion/out/windows/TDACompanion-x64.msi
            local-companion/out/windows/TDACompanion-x64.msi.sha256
            local-companion/out/windows/TDACompanion-payload-manifest.json
            local-companion/out/windows/TDACompanion-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 90

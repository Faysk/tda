name: World Command Palette E2E

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/world-command-palette-e2e.yml"
      - "playwright.config.ts"
      - "tests/world-authoring-command-palette.spec.ts"
      - "src/app/e2e-fixtures/world-command-palette/**"
      - "src/features/world-explorer/components/world-command-palette.tsx"
      - "src/features/world-explorer/components/world-command-palette-trigger.tsx"
      - "src/features/world-explorer/components/world-command-palette-e2e-fixture.tsx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run command palette keyboard and ARIA contract
        run: pnpm exec playwright test tests/world-authoring-command-palette.spec.ts --project=desktop-1080p

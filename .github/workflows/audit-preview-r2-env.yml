name: Audit Preview R2 env

on:
  push:
    branches: [ops/audit-preview-r2-env-20260914]

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_9wuTfarCQ3L63xtufPKUDzi0
  VERCEL_PROJECT_ID: prj_hDiDvvRiesg3qCDekGWE8JQMkIyH
  VERCEL_CLI_VERSION: 59.11.7

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Require Vercel deployment credential
        shell: bash
        run: |
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub Environment secret VERCEL_TOKEN for preview."
            exit 1
          fi

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull Preview environment and report R2 key presence
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE="$RUNNER_TEMP/tda-preview-r2-audit.env"
          vercel env pull "$ENV_FILE" --yes --environment=preview --token="$VERCEL_TOKEN" >/dev/null
          chmod 600 "$ENV_FILE"
          node --env-file="$ENV_FILE" --input-type=module - <<'NODE'
          const required = [
            "R2_ACCOUNT_ID",
            "R2_ACCESS_KEY_ID",
            "R2_SECRET_ACCESS_KEY",
            "R2_PUBLIC_BUCKET",
          ];
          let missing = 0;
          for (const key of required) {
            const value = process.env[key]?.trim();
            const ok = key === "R2_PUBLIC_BUCKET" ? value === "tda-media-public" : Boolean(value);
            console.log(`${key}=${ok ? "present" : "missing_or_invalid"}`);
            if (!ok) missing += 1;
          }
          console.log(`R2_ENV_AUDIT missing=${missing} total=${required.length}`);
          if (missing > 0) process.exitCode = 2;
          NODE

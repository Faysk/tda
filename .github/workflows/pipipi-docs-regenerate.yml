name: Pipipi Docs Regenerate

on:
  push:
    branches: [feat/pipipi-cinematic-lore]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pipipi-cinematic-lore
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: corepack enable
      - name: Regenerate documentation catalog
        run: pnpm docs:generate
      - name: Commit generated catalog and remove temporary workflow
        run: |
          rm .github/workflows/pipipi-docs-regenerate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/documentation/catalog.md .github/workflows/pipipi-docs-regenerate.yml
          git commit -m "docs: regenerate catalog after Pipipi QA"
          git push origin HEAD:feat/pipipi-cinematic-lore
